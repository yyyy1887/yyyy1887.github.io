<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 
    ====================================================================
    [ REVISION HISTORY ]
    - REV 1.11 (2026-11-02) : @@, @@@, @@@@ 체계의 대/중/소제목 개요 파싱 및 에디터 반영 완료
    ====================================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Style Workspace (REV 1.11)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-sidebar: #181818;
      --bg-header: #222222;
      --bg-hover: #2a2d2e;
      --bg-active: #37373d;
      --text-main: #dcddde;
      --text-muted: #8e8e93;
      --accent: #7f6df2;
      --accent-hover: #6b56eb;
      --border: #2d2d2d;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-family); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Login Screen Overlay */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #181818; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .auth-card { background: #252526; border: 1px solid var(--border); border-radius: 8px; padding: 32px; width: 360px; text-align: center; }
    .auth-card h2 { margin-bottom: 16px; font-size: 20px; color: var(--text-main); }
    .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .auth-card input { width: 100%; background: #1e1e1e; border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 4px; font-size: 14px; outline: none; margin-bottom: 16px; text-align: center; }
    .auth-card button { width: 100%; background: var(--accent); border: none; color: white; padding: 10px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .auth-card button:hover { background: var(--accent-hover); }

    .app-container { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }
    
    .top-bar { height: 40px; background-color: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; color: var(--text-muted); }
    .top-bar-left { display: flex; align-items: center; gap: 20px; }
    .top-bar-right { display: flex; align-items: center; gap: 8px; }
    .top-bar-title { font-weight: 600; color: var(--text-main); }
    
    .top-tabs { display: flex; gap: 4px; }
    .top-tab-btn { background: none; border: none; color: var(--text-muted); padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
    .top-tab-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
    .top-tab-btn.active { background-color: var(--accent); color: white; }

    .gh-btn { background: #238636; border: 1px solid #2ea043; color: white; padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .gh-btn:hover { background: #2ea043; }
    
    .batch-tag-btn { background: #333; border: 1px solid var(--border); color: var(--text-main); padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .batch-tag-btn:hover { background: var(--bg-active); }

    .github-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .github-modal-content { background: #252526; border: 1px solid var(--border); border-radius: 8px; padding: 24px; width: 440px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input { width: 100%; background: #1e1e1e; border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; font-size: 13px; outline: none; }

    .left-sidebar { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 8px 10px; display: flex; gap: 4px; border-bottom: 1px solid var(--border); align-items: center; }
    .search-box { flex: 1; background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 8px; border-radius: 4px; font-size: 12px; outline: none; min-width: 0; }
    .sort-select { background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 5px; border-radius: 4px; font-size: 11px; outline: none; cursor: pointer; }
    .icon-btn { background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .icon-btn:hover { background: var(--bg-active); }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 8px 4px; }
    .sidebar-footer { display: flex; border-top: 1px solid var(--border); background: var(--bg-header); }
    .sidebar-tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .sidebar-tab-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .sidebar-tab-btn.active { background: var(--accent); color: white; }

    .tree-node { position: relative; user-select: none; }
    .tree-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; border-radius: 4px; font-size: 13px; cursor: pointer; color: var(--text-main); }
    .tree-row:hover { background-color: var(--bg-hover); }
    .tree-row.selected { background-color: rgba(127, 109, 242, 0.2); color: var(--text-main); }
    .tree-row.active-file { background-color: var(--bg-active); color: #fff; }

    .node-title-group { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .toggle-icon { width: 14px; text-align: center; color: var(--text-muted); font-size: 10px; cursor: pointer; }
    .node-icon { color: var(--text-muted); font-size: 12px; }

    .node-actions { display: flex; gap: 4px; opacity: 0; }
    .tree-row:hover .node-actions { opacity: 1; }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn.delete:hover { color: #ff5555; }

    .tree-children { padding-left: 14px; display: none; }
    .tree-children.open { display: block; }

    .view-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; }

    .main-editor { flex: 1; display: flex; flex-direction: column; height: 100%; padding: 24px 40px; overflow-y: auto; }
    .note-title-input { background: none; border: none; font-size: 28px; font-weight: 700; color: var(--text-main); outline: none; margin-bottom: 16px; }
    
    .properties-panel { background: #252526; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 24px; font-size: 13px; }
    .prop-row { display: flex; align-items: center; gap: 12px; }
    .prop-key { color: var(--text-muted); width: 60px; font-weight: 500; }
    .tags-container { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    
    .tag-chip { background: #e0f0ff; color: #0277bd; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #b3e5fc; }
    .tag-chip i { cursor: pointer; font-size: 10px; }
    .add-tag-input { background: none; border: none; color: var(--text-main); outline: none; font-size: 12px; width: 80px; }

    .textarea-editor { flex: 1; background: none; border: none; color: var(--text-main); font-family: var(--font-family); font-size: 15px; line-height: 1.6; resize: none; outline: none; min-height: 300px; tab-size: 2; }

    .hashtag-agg-container { flex: 1; padding: 24px 32px; overflow-y: auto; display: none; }
    .agg-header { font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: var(--accent); }
    .agg-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #252526; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .agg-table th, .agg-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    .agg-table th { background: #222; color: var(--text-muted); font-weight: 600; }
    .agg-note-title { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; white-space: nowrap; }
    .agg-note-title:hover { color: var(--accent-hover); }
    .agg-content-block { line-height: 1.6; color: var(--text-main); white-space: pre-wrap; font-family: var(--font-family); }

    .todo-dashboard { flex: 1; padding: 24px 32px; overflow-y: auto; display: none; }
    .todo-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .todo-title { font-size: 24px; font-weight: 700; }

    .todo-list-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    .todo-list-table th, .todo-list-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .todo-list-table th { background: #252526; color: var(--text-muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
    
    .table-filter-select { background: #1e1e1e; border: 1px solid var(--border); color: var(--text-main); padding: 4px 6px; border-radius: 4px; font-size: 11px; outline: none; width: 100%; margin-top: 4px; cursor: pointer; }

    .tag-badge { background: rgba(127, 109, 242, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }

    .todo-assignee { color: #4db6ac; font-weight: 500; }
    .todo-date { color: var(--text-muted); font-size: 12px; }
    .todo-note-link { color: var(--text-main); text-decoration: underline; cursor: pointer; }
    .todo-note-link:hover { color: var(--accent); }
    .todo-checkbox { cursor: pointer; width: 16px; height: 16px; accent-color: var(--accent); }

    .revision-dashboard { flex: 1; padding: 32px 40px; overflow-y: auto; display: none; }
    .revision-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
    .rev-list { display: flex; flex-direction: column; gap: 16px; }
    .rev-card { background: #252526; border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; }
    .rev-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .rev-version { font-weight: 700; color: var(--accent); font-size: 16px; }
    .rev-date { color: var(--text-muted); font-size: 12px; }
    .rev-desc { font-size: 14px; color: var(--text-main); line-height: 1.5; }

    .right-sidebar { width: 280px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .calendar-widget { padding: 16px; border-bottom: 1px solid var(--border); }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
    .cal-day-label { color: var(--text-muted); padding-bottom: 4px; }
    .cal-cell { padding: 6px 0; border-radius: 4px; cursor: pointer; color: var(--text-main); }
    .cal-cell:hover { background: var(--bg-hover); }
    .cal-cell.today { background: var(--accent); color: white; font-weight: bold; }
    
    .panel-section { flex: 1; padding: 16px; overflow-y: auto; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .link-list, .outline-list { list-style: none; font-size: 13px; }
    .link-item, .outline-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-main); margin-bottom: 4px; }
    .link-item:hover, .outline-item:hover { background-color: var(--bg-hover); }
    
    .outline-h2 { font-weight: 600; color: var(--text-main); }
    .outline-h3 { padding-left: 14px; color: var(--text-muted); }
    .outline-h4 { padding-left: 26px; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>

  <!-- Login Password Overlay -->
  <div class="auth-overlay" id="auth-overlay" style="display: none;">
    <div class="auth-card">
      <h2 id="auth-title">🔒 보안 잠금</h2>
      <p id="auth-desc">설정된 비밀번호를 입력하세요.</p>
      <input type="password" id="auth-password-input" placeholder="비밀번호 입력">
      <button onclick="handleAuthSubmit()">확인</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-bar-title"><i class="fa-solid fa-book-bookmark"></i> Obsidian Vault</div>
      <div class="top-tabs">
        <button class="top-tab-btn active" id="tab-editor-btn" onclick="switchView('editor')"><i class="fa-regular fa-file-lines"></i> 노트 에디터</button>
        <button class="top-tab-btn" id="tab-todo-btn" onclick="switchView('todo')"><i class="fa-solid fa-list-check"></i> TODO 모아보기</button>
      </div>
    </div>
    <div class="top-bar-right">
      <button class="batch-tag-btn" onclick="openBatchTagModal()"><i class="fa-solid fa-tags"></i> 해시태그 일괄 변경</button>
      <button class="gh-btn" onclick="openGitHubModal()"><i class="fa-brands fa-github"></i> GitHub DB 저장</button>
      <button class="top-tab-btn" id="tab-revision-btn" onclick="switchView('revision')"><i class="fa-solid fa-code-branch"></i> Revision</button>
    </div>
  </div>

  <!-- Batch Tag Change Modal -->
  <div class="github-modal" id="batch-tag-modal">
    <div class="github-modal-content">
      <div class="modal-title">
        <span><i class="fa-solid fa-tags"></i> 해시태그 일괄 변경</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeBatchTagModal()"></i>
      </div>
      <div class="form-group">
        <label>변경할 대상 해시태그 (예: PJT/해외/TATA)</label>
        <input type="text" id="batch-old-tag" placeholder="기존 해시태그 입력 (# 제외)">
      </div>
      <div class="form-group">
        <label>새로운 해시태그 (예: PJT/국내/SEOUL)</label>
        <input type="text" id="batch-new-tag" placeholder="새로운 해시태그 입력 (# 제외)">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="gh-btn" style="flex: 1; justify-content: center;" onclick="executeBatchTagChange()">일괄 변경 실행</button>
      </div>
    </div>
  </div>

  <!-- Move Note Modal -->
  <div class="github-modal" id="move-note-modal">
    <div class="github-modal-content">
      <div class="modal-title">
        <span><i class="fa-solid fa-folder-tree"></i> 노트 폴더 이동</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeMoveModal()"></i>
      </div>
      <div class="form-group">
        <label>이동할 대상 폴더 선택</label>
        <select id="move-target-folder-select" class="table-filter-select" style="padding: 8px; font-size: 13px;"></select>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="gh-btn" style="flex: 1; justify-content: center;" onclick="executeMoveNote()">이동하기</button>
      </div>
    </div>
  </div>

  <!-- GitHub Sync Modal -->
  <div class="github-modal" id="gh-modal">
    <div class="github-modal-content">
      <div class="modal-title">
        <span><i class="fa-brands fa-github"></i> 환경 설정 및 GitHub 연동</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeGitHubModal()"></i>
      </div>
      <div class="form-group">
        <label>GitHub Owner / Repo (예: yyyy1887/yyyy1887.github.io)</label>
        <input type="text" id="gh-repo" placeholder="사용자명/저장소명">
      </div>
      <div class="form-group">
        <label>Branch (기본값: main)</label>
        <input type="text" id="gh-branch" value="main">
      </div>
      <div class="form-group">
        <label>Personal Access Token (repo 권한 필요)</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">
      <div class="form-group">
        <label>로그인 비밀번호 설정 (비워두면 잠금 해제)</label>
        <input type="password" id="gh-app-password" placeholder="새 비밀번호 입력">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="gh-btn" style="flex: 1; justify-content: center;" onclick="commitToGitHubDB()"><i class="fa-solid fa-cloud-arrow-up"></i> DB.md 커밋</button>
        <button class="icon-btn" style="flex: 1; justify-content: center;" onclick="loadFromGitHubDB()"><i class="fa-solid fa-cloud-arrow-down"></i> DB.md 불러오기</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="left-sidebar">
      <div class="sidebar-header" id="sidebar-header-search">
        <input type="text" id="search-input" class="search-box" placeholder="검색...">
        <select class="sort-select" id="sort-select" onchange="changeSortMode(this.value)" title="정렬 기준 설정">
          <option value="name-asc">이름 오름차순 (A-Z)</option>
          <option value="name-desc">이름 내림차순 (Z-A)</option>
          <option value="date-newest">생성일 최신순</option>
          <option value="date-oldest">생성일 오래된순</option>
        </select>
        <button id="add-root-folder" class="icon-btn" title="루트 폴더 추가"><i class="fa-solid fa-folder-plus"></i></button>
        <button id="add-note-btn" class="icon-btn" title="새 노트 추가"><i class="fa-solid fa-file-circle-plus"></i></button>
      </div>
      
      <div class="sidebar-body" id="sidebar-body-container"></div>

      <div class="sidebar-footer">
        <button class="sidebar-tab-btn active" id="sb-tab-folder" onclick="switchSidebarTab('folder')"><i class="fa-solid fa-folder"></i> Folder</button>
        <button class="sidebar-tab-btn" id="sb-tab-hashtag" onclick="switchSidebarTab('hashtag')"><i class="fa-solid fa-hashtag"></i> Hashtag</button>
      </div>
    </div>

    <div class="view-container">
      <div class="main-editor" id="editor-view">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;" id="current-path-label">Vault</div>
        <input type="text" id="note-title-input" class="note-title-input" placeholder="제목 없음">
        
        <div class="properties-panel">
          <div class="prop-row">
            <span class="prop-key">Tags</span>
            <div class="tags-container" id="tags-container">
              <input type="text" id="add-tag-input" class="add-tag-input" placeholder="+ 태그 추가">
            </div>
          </div>
        </div>

        <textarea id="textarea-editor" class="textarea-editor" placeholder="내용을 입력하세요...&#10;&#10;@@ 대제목&#10;@@@ 중제목&#10;@@@@ 소제목&#10;&#10;#PJT/해외/TATA&#10;- 내용1&#10;  - 내용2&#10;&#10;[ 할일 항목 / @담당자 / E:2026-12-02 ]"></textarea>
      </div>

      <div class="hashtag-agg-container" id="hashtag-agg-view"></div>

      <div class="todo-dashboard" id="todo-view">
        <div class="todo-header">
          <div class="todo-title"><i class="fa-solid fa-list-check" style="color: var(--accent);"></i> TODO 관리자</div>
        </div>
        
        <div style="overflow-x: auto;">
          <table class="todo-list-table">
            <thead id="todo-table-head"></thead>
            <tbody id="todo-table-body"></tbody>
          </table>
        </div>
      </div>

      <div class="revision-dashboard" id="revision-view">
        <div class="revision-title"><i class="fa-solid fa-code-branch" style="color: var(--accent);"></i> 프로그램 Revision 관리 이력</div>
        <div class="rev-list">
          <div class="rev-card">
            <div class="rev-card-header">
              <span class="rev-version">REV 1.11</span>
              <span class="rev-date">2026-11-02</span>
            </div>
            <div class="rev-desc">@@, @@@, @@@@ 체계의 대/중/소제목 개요 파싱 및 탭 전환 안정화 적용</div>
          </div>
        </div>
      </div>
    </div>

    <div class="right-sidebar">
      <div class="calendar-widget">
        <div class="cal-header">
          <button id="prev-month" class="icon-btn" style="padding: 2px 6px;"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="cal-month-year"></span>
          <button id="next-month" class="icon-btn" style="padding: 2px 6px;"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="panel-section" style="border-bottom: 1px solid var(--border);">
        <div class="section-title"><i class="fa-solid fa-link"></i> 역방향 링크</div>
        <ul class="link-list" id="backlinks-list"></ul>
      </div>

      <div class="panel-section">
        <div class="section-title"><i class="fa-solid fa-list-ul"></i> 개요</div>
        <ul class="outline-list" id="outline-list"></ul>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'obsidian_tree_vault_data';
    const GH_CONFIG_KEY = 'obsidian_gh_config';

    let state = {
      tree: [],
      selectedFolderId: null,
      activeNoteId: null,
      currentView: 'editor',
      sidebarTab: 'folder',
      openHashtags: {},
      selectedHashtagQuery: null,
      currentCalDate: new Date(),
      sortMode: 'name-asc',
      todoFilters: {}
    };

    let movingNoteId = null;

    async function init() {
      checkAuth();
      loadGitHubConfig();
      await loadDataFromDBFile();
      bindEvents();
      bindEditorSmartKeys();
      renderSidebar();
      renderActiveNote();
      renderCalendar();
      renderRightPanel();
    }

    function checkAuth() {
      const config = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || '{}');
      if (config.appPassword) {
        document.getElementById('auth-overlay').style.display = 'flex';
      }
    }

    function handleAuthSubmit() {
      const inputVal = document.getElementById('auth-password-input').value;
      const config = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || '{}');
      if (inputVal === config.appPassword) {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('auth-password-input').value = '';
      } else {
        alert('비밀번호가 일치하지 않습니다.');
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    async function loadDataFromDBFile() {
      let localTree = [];
      const localData = localStorage.getItem(STORAGE_KEY);
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          if (parsed.tree && parsed.tree.length > 0) {
            localTree = parsed.tree;
            state.selectedFolderId = parsed.selectedFolderId || null;
            state.activeNoteId = parsed.activeNoteId || null;
            state.sortMode = parsed.sortMode || 'name-asc';
            document.getElementById('sort-select').value = state.sortMode;
          }
        } catch (e) {}
      }

      try {
        const response = await fetch('./DB.md');
        if (response.ok) {
          const text = await response.text();
          const jsonMatch = text.match(/```json\n([\s\S]*?)\n```/);
          if (jsonMatch && jsonMatch[1]) {
            const dbData = JSON.parse(jsonMatch[1]);
            state.tree = mergeTrees(localTree, dbData.tree || []);
            saveData();
            return;
          }
        }
      } catch (e) {}

      if (localTree.length === 0) {
        state.tree = [
          {
            id: 'folder-1',
            name: '0101 Project',
            type: 'folder',
            isOpen: true,
            children: [
              {
                id: 'note-1',
                name: '2026년 6월 4주',
                type: 'file',
                createdDate: '2026-11-02',
                tags: ['PJT'],
                content: '#PJT/해외/TATA\n- 검수 일정 변경됨 8일, 10일로 변경'
              }
            ]
          }
        ];
        state.selectedFolderId = 'folder-1';
        state.activeNoteId = 'note-1';
      } else {
        state.tree = localTree;
      }
      saveData();
    }

    function mergeTrees(localNodes, serverNodes) {
      if (!localNodes || localNodes.length === 0) return serverNodes;
      if (!serverNodes || serverNodes.length === 0) return localNodes;

      const mergedMap = new Map();
      serverNodes.forEach(node => mergedMap.set(node.id, node));

      localNodes.forEach(localNode => {
        if (!mergedMap.has(localNode.id)) {
          mergedMap.set(localNode.id, localNode);
        } else {
          const serverNode = mergedMap.get(localNode.id);
          if (localNode.type === 'folder' && serverNode.type === 'folder') {
            serverNode.children = mergeTrees(localNode.children, serverNode.children);
          } else if (localNode.type === 'file') {
            if ((localNode.content || '').length >= (serverNode.content || '').length) {
              mergedMap.set(localNode.id, localNode);
            }
          }
        }
      });

      return Array.from(mergedMap.values());
    }

    function openGitHubModal() {
      const config = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || '{}');
      document.getElementById('gh-app-password').value = config.appPassword || '';
      document.getElementById('gh-modal').style.display = 'flex';
    }
    function closeGitHubModal() { document.getElementById('gh-modal').style.display = 'none'; }

    function openBatchTagModal() {
      document.getElementById('batch-old-tag').value = '';
      document.getElementById('batch-new-tag').value = '';
      document.getElementById('batch-tag-modal').style.display = 'flex';
    }
    function closeBatchTagModal() { document.getElementById('batch-tag-modal').style.display = 'none'; }

    function executeBatchTagChange() {
      const oldTag = document.getElementById('batch-old-tag').value.trim();
      const newTag = document.getElementById('batch-new-tag').value.trim();

      if (!oldTag || !newTag) {
        alert('변경할 기존 해시태그와 새로운 해시태그를 모두 입력해주세요.');
        return;
      }

      const allFiles = getAllFiles();
      let updateCount = 0;

      allFiles.forEach(file => {
        if (!file.content) return;
        const lines = file.content.split('\n');
        let modified = false;

        const newLines = lines.map(line => {
          const trimmed = line.trim();
          if (trimmed.startsWith('#') && !trimmed.startsWith('# ')) {
            const tagVal = trimmed.substring(1).trim();
            if (tagVal === oldTag || tagVal.startsWith(oldTag + '/')) {
              modified = true;
              return '#' + tagVal.replace(oldTag, newTag);
            }
          }
          return line;
        });

        if (modified) {
          file.content = newLines.join('\n');
          updateCount++;
        }
      });

      saveData();
      renderSidebar();
      renderActiveNote();
      alert(`총 ${updateCount}개의 노트에서 해시태그가 성공적으로 변경되었습니다.`);
      closeBatchTagModal();
    }

    function openMoveModal(noteId, event) {
      event.stopPropagation();
      movingNoteId = noteId;
      
      const selectEl = document.getElementById('move-target-folder-select');
      selectEl.innerHTML = '<option value="ROOT">(최상위 루트 Vault)</option>';

      function collectFolders(nodes, depth = 0) {
        nodes.forEach(node => {
          if (node.type === 'folder') {
            const indent = '&nbsp;&nbsp;'.repeat(depth);
            selectEl.innerHTML += `<option value="${node.id}">${indent}📁 ${node.name}</option>`;
            if (node.children) collectFolders(node.children, depth + 1);
          }
        });
      }
      collectFolders(state.tree);

      document.getElementById('move-note-modal').style.display = 'flex';
    }

    function closeMoveModal() {
      document.getElementById('move-note-modal').style.display = 'none';
      movingNoteId = null;
    }

    function executeMoveNote() {
      if (!movingNoteId) return;
      const targetFolderId = document.getElementById('move-target-folder-select').value;

      const noteNode = findNode(state.tree, movingNoteId);
      if (!noteNode) return;

      removeNode(state.tree, movingNoteId);

      if (targetFolderId === 'ROOT') {
        state.tree.push(noteNode);
      } else {
        const targetFolder = findNode(state.tree, targetFolderId);
        if (targetFolder && targetFolder.type === 'folder') {
          if (!targetFolder.children) targetFolder.children = [];
          targetFolder.children.push(noteNode);
          targetFolder.isOpen = true;
        } else {
          state.tree.push(noteNode);
        }
      }

      saveData();
      renderSidebar();
      renderActiveNote();
      alert('노트가 성공적으로 이동되었습니다!');
      closeMoveModal();
    }

    function loadGitHubConfig() {
      const cfg = localStorage.getItem(GH_CONFIG_KEY);
      if (cfg) {
        try {
          const parsed = JSON.parse(cfg);
          document.getElementById('gh-repo').value = parsed.repo || '';
          document.getElementById('gh-branch').value = parsed.branch || 'main';
          document.getElementById('gh-token').value = parsed.token || '';
          document.getElementById('gh-app-password').value = parsed.appPassword || '';
        } catch(e) {}
      }
    }

    function saveGitHubConfig() {
      const existing = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || '{}');
      const config = {
        repo: document.getElementById('gh-repo').value.trim(),
        branch: document.getElementById('gh-branch').value.trim() || 'main',
        token: document.getElementById('gh-token').value.trim(),
        appPassword: document.getElementById('gh-app-password').value.trim() || existing.appPassword || ''
      };
      localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(config));
      return config;
    }

    async function commitToGitHubDB() {
      const cfg = saveGitHubConfig();
      if (!cfg.repo || !cfg.token) {
        alert('GitHub Repo와 Personal Access Token을 입력해주세요.');
        return;
      }

      const exportData = {
        tree: state.tree,
        selectedFolderId: state.selectedFolderId,
        activeNoteId: state.activeNoteId,
        sortMode: state.sortMode
      };
      
      const mdContent = `# Obsidian Vault Database\n\n\`\`\`json\n${JSON.stringify(exportData, null, 2)}\n\`\`\`\n`;
      const contentB64 = btoa(unescape(encodeURIComponent(mdContent)));

      const url = `https://api.github.com/repos/${cfg.repo}/contents/DB.md`;
      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      try {
        let sha = '';
        const getRes = await fetch(`${url}?ref=${cfg.branch}`, { headers });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const body = {
          message: 'Update DB.md via Obsidian Web Workspace',
          content: contentB64,
          branch: cfg.branch
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
          method: 'PUT',
          headers,
          body: JSON.stringify(body)
        });

        if (putRes.ok) {
          alert('GitHub 루트 디렉토리의 DB.md 파일에 성공적으로 커밋되었습니다!');
          closeGitHubModal();
        } else {
          const err = await putRes.json();
          alert('저장 실패: ' + (err.message || '토큰 및 권한을 확인하세요.'));
        }
      } catch (e) {
        alert('API 연동 오류: ' + e.message);
      }
    }

    async function loadFromGitHubDB() {
      const cfg = saveGitHubConfig();
      if (!cfg.repo || !cfg.token) {
        alert('GitHub Repo와 Personal Access Token을 입력해주세요.');
        return;
      }

      const url = `https://api.github.com/repos/${cfg.repo}/contents/DB.md?ref=${cfg.branch}`;
      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json'
      };

      try {
        const res = await fetch(url, { headers });
        if (res.ok) {
          const data = await res.json();
          const decoded = decodeURIComponent(escape(atob(data.content)));
          const jsonMatch = decoded.match(/```json\n([\s\S]*?)\n```/);
          if (jsonMatch && jsonMatch[1]) {
            const dbData = JSON.parse(jsonMatch[1]);
            state.tree = mergeTrees(state.tree, dbData.tree || []);
            state.sortMode = dbData.sortMode || state.sortMode;
            document.getElementById('sort-select').value = state.sortMode;
            saveData();
            renderSidebar();
            renderActiveNote();
            alert('GitHub 최신 데이터를 기존 데이터와 안전하게 병합하여 불러왔습니다!');
            closeGitHubModal();
          }
        } else {
          alert('불러오기 실패: 저장소 경로 및 토큰을 확인해주세요.');
        }
      } catch (e) {
        alert('오류 발생: ' + e.message);
      }
    }

    function changeSortMode(mode) {
      state.sortMode = mode;
      saveData();
      renderSidebar();
    }

    function sortNodes(nodes) {
      if (!nodes || !Array.isArray(nodes)) return [];
      
      const sorted = [...nodes].sort((a, b) => {
        if (a.type !== b.type) {
          return a.type === 'folder' ? -1 : 1;
        }

        if (state.sortMode === 'name-asc') {
          return a.name.localeCompare(b.name, 'ko', { numeric: true, sensitivity: 'base' });
        } else if (state.sortMode === 'name-desc') {
          return b.name.localeCompare(a.name, 'ko', { numeric: true, sensitivity: 'base' });
        } else if (state.sortMode === 'date-newest') {
          const dateA = a.createdDate || '1970-01-01';
          const dateB = b.createdDate || '1970-01-01';
          return dateB.localeCompare(dateA);
        } else if (state.sortMode === 'date-oldest') {
          const dateA = a.createdDate || '1970-01-01';
          const dateB = b.createdDate || '1970-01-01';
          return dateA.localeCompare(dateB);
        }
        return 0;
      });

      sorted.forEach(node => {
        if (node.type === 'folder' && node.children) {
          node.children = sortNodes(node.children);
        }
      });

      return sorted;
    }

    function findNode(nodes, id) {
      for (const node of nodes) {
        if (node.id === id) return node;
        if (node.type === 'folder' && node.children) {
          const found = findNode(node.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function findParentNode(nodes, targetId, parent = null) {
      for (const node of nodes) {
        if (node.id === targetId) return parent;
        if (node.type === 'folder' && node.children) {
          const found = findParentNode(node.children, targetId, node);
          if (found) return found;
        }
      }
      return null;
    }

    function removeNode(nodes, id) {
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].id === id) {
          nodes.splice(i, 1);
          return true;
        }
        if (nodes[i].type === 'folder' && nodes[i].children) {
          if (removeNode(nodes[i].children, id)) return true;
        }
      }
      return false;
    }

    function getAllFiles(nodes = state.tree) {
      let files = [];
      for (const node of nodes) {
        if (node.type === 'file') files.push(node);
        if (node.type === 'folder' && node.children) {
          files = files.concat(getAllFiles(node.children));
        }
      }
      return files;
    }

    function bindEditorSmartKeys() {
      const textarea = document.getElementById('textarea-editor');

      textarea.addEventListener('keydown', function(e) {
        const start = this.selectionStart;
        const end = this.selectionEnd;
        const value = this.value;

        if (e.key === 'Tab') {
          e.preventDefault();

          const lineStart = value.lastIndexOf('\n', start - 1) + 1;
          const lineEnd = value.indexOf('\n', end);
          const actualLineEnd = lineEnd === -1 ? value.length : lineEnd;
          const currentLine = value.substring(lineStart, actualLineEnd);

          if (!e.shiftKey) {
            this.value = value.substring(0, lineStart) + '  ' + currentLine + value.substring(actualLineEnd);
            this.selectionStart = start + 2;
            this.selectionEnd = end + 2;
          } else {
            if (currentLine.startsWith('  ')) {
              this.value = value.substring(0, lineStart) + currentLine.substring(2) + value.substring(actualLineEnd);
              this.selectionStart = Math.max(lineStart, start - 2);
              this.selectionEnd = Math.max(lineStart, end - 2);
            } else if (currentLine.startsWith(' ')) {
              this.value = value.substring(0, lineStart) + currentLine.substring(1) + value.substring(actualLineEnd);
              this.selectionStart = Math.max(lineStart, start - 1);
              this.selectionEnd = Math.max(lineStart, end - 1);
            }
          }

          triggerEditorInput();
        }

        if (e.key === 'Enter') {
          const lineStart = value.lastIndexOf('\n', start - 1) + 1;
          const currentLine = value.substring(lineStart, start);
          const bulletMatch = currentLine.match(/^(\s*)([-\*\+])\s+/);

          if (bulletMatch) {
            const indent = bulletMatch[1];
            const bullet = bulletMatch[2];
            const contentAfterBullet = currentLine.substring(bulletMatch[0].length).trim();

            if (contentAfterBullet === '') {
              e.preventDefault();
              this.value = value.substring(0, lineStart) + value.substring(start);
              this.selectionStart = this.selectionEnd = lineStart;
            } else {
              e.preventDefault();
              const newLinePrefix = `\n${indent}${bullet} `;
              this.value = value.substring(0, start) + newLinePrefix + value.substring(end);
              this.selectionStart = this.selectionEnd = start + newLinePrefix.length;
            }

            triggerEditorInput();
          }
        }
      });
    }

    function triggerEditorInput() {
      const textarea = document.getElementById('textarea-editor');
      const event = new Event('input', { bubbles: true });
      textarea.dispatchEvent(event);
    }

    function bindEvents() {
      document.getElementById('add-root-folder').addEventListener('click', () => createFolder(null));
      document.getElementById('add-note-btn').addEventListener('click', () => createNote(state.selectedFolderId));

      const titleInput = document.getElementById('note-title-input');
      const textEditor = document.getElementById('textarea-editor');

      titleInput.addEventListener('input', (e) => {
        const note = findNode(state.tree, state.activeNoteId);
        if (note) {
          note.name = e.target.value;
          saveData();
          renderSidebar();
        }
      });

      textEditor.addEventListener('input', (e) => {
        const note = findNode(state.tree, state.activeNoteId);
        if (note) {
          note.content = e.target.value;
          saveData();
          renderRightPanel();
        }
      });

      const tagInput = document.getElementById('add-tag-input');
      tagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && tagInput.value.trim() !== '') {
          const note = findNode(state.tree, state.activeNoteId);
          if (note) {
            if (!note.tags) note.tags = [];
            note.tags.push(tagInput.value.trim());
            tagInput.value = '';
            saveData();
            renderTags();
          }
        }
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        renderSidebar(e.target.value.toLowerCase());
      });

      document.getElementById('prev-month').addEventListener('click', () => {
        state.currentCalDate.setMonth(state.currentCalDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('next-month').addEventListener('click', () => {
        state.currentCalDate.setMonth(state.currentCalDate.getMonth() + 1);
        renderCalendar();
      });
    }

    function switchView(viewName) {
      state.currentView = viewName;
      
      document.getElementById('tab-editor-btn').classList.toggle('active', viewName === 'editor');
      document.getElementById('tab-revision-btn').classList.toggle('active', viewName === 'revision');

      document.getElementById('editor-view').style.display = (viewName === 'editor') ? 'flex' : 'none';
      document.getElementById('hashtag-agg-view').style.display = (viewName === 'hashtag-agg') ? 'block' : 'none';
      document.getElementById('todo-view').style.display = (viewName === 'todo') ? 'block' : 'none';
      document.getElementById('revision-view').style.display = (viewName === 'revision') ? 'block' : 'none';

      if (viewName === 'todo') renderTodoDashboard();
    }

    function switchSidebarTab(tabName) {
      state.sidebarTab = tabName;
      document.getElementById('sb-tab-folder').classList.toggle('active', tabName === 'folder');
      document.getElementById('sb-tab-hashtag').classList.toggle('active', tabName === 'hashtag');

      const searchHeader = document.getElementById('sidebar-header-search');
      if (tabName === 'hashtag') {
        searchHeader.style.display = 'none';
      } else {
        searchHeader.style.display = 'flex';
      }

      renderSidebar();
    }

    function renderSidebar(filter = '') {
      const container = document.getElementById('sidebar-body-container');
      container.innerHTML = '';

      if (state.sidebarTab === 'folder') {
        container.appendChild(renderTreeNodes(state.tree, filter));
      } else {
        container.appendChild(renderHashtagSidebarTree());
      }
    }

    function renderHashtagSidebarTree() {
      const allFiles = getAllFiles();
      const tagCounts = {};

      allFiles.forEach(file => {
        if (!file.content) return;
        const lines = file.content.split('\n');
        lines.forEach(line => {
          const trimmed = line.trim();
          if (trimmed.startsWith('#') && !trimmed.startsWith('# ')) {
            const cleanTag = trimmed.substring(1).trim();
            if (cleanTag) {
              const parts = cleanTag.split('/');
              let currentPath = '';
              parts.forEach(p => {
                currentPath = currentPath ? `${currentPath}/${p}` : p;
                tagCounts[currentPath] = (tagCounts[currentPath] || 0) + 1;
              });
            }
          }
        });
      });

      const rootObj = {};
      Object.keys(tagCounts).forEach(path => {
        const parts = path.split('/');
        let curr = rootObj;
        parts.forEach((part, idx) => {
          if (!curr[part]) {
            curr[part] = { _fullPath: parts.slice(0, idx + 1).join('/'), _count: tagCounts[parts.slice(0, idx + 1).join('/')], _children: {} };
          }
          curr = curr[part]._children;
        });
      });

      const wrapper = document.createElement('div');

      function buildDom(obj) {
        const div = document.createElement('div');
        Object.keys(obj).forEach(key => {
          const nodeData = obj[key];
          const hasChildren = nodeData._children && Object.keys(nodeData._children).length > 0;
          const fullPath = nodeData._fullPath;
          const isOpen = state.openHashtags[fullPath] !== false;

          const nodeEl = document.createElement('div');
          nodeEl.className = 'tree-node';

          nodeEl.innerHTML = `
            <div class="tree-row ${state.selectedHashtagQuery === fullPath ? 'selected' : ''}" onclick="selectHashtagNode('${fullPath}')">
              <div class="node-title-group">
                <span class="toggle-icon" onclick="toggleHashtagNode('${fullPath}', event)">
                  ${hasChildren ? `<i class="fa-solid fa-chevron-${isOpen ? 'down' : 'right'}"></i>` : ''}
                </span>
                <i class="fa-solid fa-hashtag" style="font-size: 11px; color: var(--accent);"></i>
                <span>${key}</span>
              </div>
              <span style="font-size: 11px; color: var(--text-muted);">${nodeData._count}</span>
            </div>
            <div class="tree-children ${isOpen ? 'open' : ''}" id="ht-children-${fullPath.replace(/[/]/g, '_')}"></div>
          `;

          if (hasChildren) {
            const childContainer = nodeEl.querySelector(`#ht-children-${fullPath.replace(/[/]/g, '_')}`);
            childContainer.appendChild(buildDom(nodeData._children));
          }

          div.appendChild(nodeEl);
        });
        return div;
      }

      if (Object.keys(tagCounts).length === 0) {
        wrapper.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px; font-size: 13px;">작성된 해시태그가 없습니다.</div>';
      } else {
        wrapper.appendChild(buildDom(rootObj));
      }

      return wrapper;
    }

    function toggleHashtagNode(fullPath, event) {
      event.stopPropagation();
      const current = state.openHashtags[fullPath] !== false;
      state.openHashtags[fullPath] = !current;
      renderSidebar();
    }

    function selectHashtagNode(fullPath) {
      state.selectedHashtagQuery = fullPath;
      renderSidebar();
      renderHashtagAggregationView(fullPath);
    }

    function renderHashtagAggregationView(tagPath) {
      state.currentView = 'hashtag-agg';
      
      document.getElementById('tab-editor-btn').classList.remove('active');
      document.getElementById('tab-revision-btn').classList.remove('active');

      document.getElementById('editor-view').style.display = 'none';
      document.getElementById('todo-view').style.display = 'none';
      document.getElementById('revision-view').style.display = 'none';
      
      const aggView = document.getElementById('hashtag-agg-view');
      aggView.style.display = 'block';
      aggView.innerHTML = '';

      const allFiles = getAllFiles();
      let matchedItems = [];

      allFiles.forEach(file => {
        if (!file.content) return;
        const lines = file.content.split('\n');
        let capturedLines = [];
        let capturing = false;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (trimmed.startsWith('#') && !trimmed.startsWith('# ')) {
            const currentTagClean = trimmed.substring(1).trim();
            if (currentTagClean === tagPath || currentTagClean.startsWith(tagPath + '/')) {
              if (capturing && capturedLines.length > 0) {
                matchedItems.push({ file, content: capturedLines.join('\n').trim() });
                capturedLines = [];
              }
              capturing = true;
              continue;
            } else if (capturing) {
              break;
            }
          }

          if (capturing) {
            capturedLines.push(line);
          }
        }

        if (capturing && capturedLines.length > 0) {
          matchedItems.push({ file, content: capturedLines.join('\n').trim() });
        }
      });

      const header = document.createElement('div');
      header.className = 'agg-header';
      header.innerHTML = `<i class="fa-solid fa-hashtag"></i> #${tagPath} 모아보기`;
      aggView.appendChild(header);

      if (matchedItems.length === 0) {
        aggView.innerHTML += `<div style="color: var(--text-muted); font-size: 13px; padding: 12px;">이 해시태그 하단에 작성된 세부 내용이 없습니다.</div>`;
        return;
      }

      let tableHtml = `
        <table class="agg-table">
          <thead>
            <tr>
              <th style="width: 220px;">노트 제목 (${matchedItems.length})</th>
              <th>내용</th>
            </tr>
          </thead>
          <tbody>
      `;

      matchedItems.forEach(item => {
        tableHtml += `
          <tr>
            <td><span class="agg-note-title" onclick="selectNote('${item.file.id}')">${item.file.name}</span></td>
            <td><div class="agg-content-block">${item.content}</div></td>
          </tr>
        `;
      });

      tableHtml += `</tbody></table>`;
      aggView.innerHTML += tableHtml;
    }

    function createFolder(parentId) {
      const name = prompt('새 폴더 이름을 입력하세요:');
      if (!name || name.trim() === '') return;

      const newFolder = {
        id: 'folder-' + Date.now(),
        name: name.trim(),
        type: 'folder',
        createdDate: new Date().toISOString().split('T')[0],
        isOpen: true,
        children: []
      };

      if (parentId) {
        const parent = findNode(state.tree, parentId);
        if (parent && parent.type === 'folder') {
          parent.children.push(newFolder);
          parent.isOpen = true;
        }
      } else {
        state.tree.push(newFolder);
      }

      state.selectedFolderId = newFolder.id;
      saveData();
      renderSidebar();
    }

    function renameFolder(folderId, event) {
      event.stopPropagation();
      const folder = findNode(state.tree, folderId);
      if (!folder) return;

      const newName = prompt('변경할 폴더 이름을 입력하세요:', folder.name);
      if (newName && newName.trim() !== '') {
        folder.name = newName.trim();
        saveData();
        renderSidebar();
        renderActiveNote();
      }
    }

    function createNote(folderId) {
      const todayStr = new Date().toISOString().split('T')[0];
      const newNote = {
        id: 'note-' + Date.now(),
        name: '제목 없는 노트',
        type: 'file',
        createdDate: todayStr,
        tags: [],
        content: ''
      };

      let targetContainer = state.tree;
      if (folderId) {
        const targetFolder = findNode(state.tree, folderId);
        if (targetFolder && targetFolder.type === 'folder') {
          targetFolder.children.push(newNote);
          targetFolder.isOpen = true;
          targetContainer = null;
        }
      }

      if (targetContainer) {
        state.tree.push(newNote);
      }

      state.activeNoteId = newNote.id;
      saveData();
      renderSidebar();
      renderActiveNote();
    }

    function deleteNodeAction(id, event) {
      event.stopPropagation();
      const node = findNode(state.tree, id);
      if (!node) return;

      if (confirm(`'${node.name}' 항목을 삭제하시겠습니까?`)) {
        removeNode(state.tree, id);

        if (state.activeNoteId === id) {
          const allFiles = getAllFiles();
          state.activeNoteId = allFiles.length > 0 ? allFiles[0].id : null;
        }
        if (state.selectedFolderId === id) {
          state.selectedFolderId = null;
        }

        saveData();
        renderSidebar();
        renderActiveNote();
      }
    }

    function toggleFolder(folderId, event) {
      event.stopPropagation();
      const folder = findNode(state.tree, folderId);
      if (folder) {
        folder.isOpen = !folder.isOpen;
        saveData();
        renderSidebar();
      }
    }

    function selectFolder(folderId) {
      state.selectedFolderId = folderId;
      renderSidebar();
    }

    function selectNote(noteId) {
      state.activeNoteId = noteId;
      const parent = findParentNode(state.tree, noteId);
      if (parent) state.selectedFolderId = parent.id;
      switchView('editor');
      renderSidebar();
      renderActiveNote();
    }

    function parseTodos() {
      const allFiles = getAllFiles();
      const todos = [];

      allFiles.forEach(file => {
        if (!file.content) return;

        const lines = file.content.split('\n');
        let currentTag = '';

        lines.forEach((line, index) => {
          const trimmed = line.trim();

          if (trimmed.startsWith('#') && !trimmed.startsWith('# ')) {
            currentTag = trimmed;
            return;
          }

          const todoMatch = trimmed.match(/^\[(.*?)\]$/);
          if (todoMatch) {
            const inner = todoMatch[1];
            const parts = inner.split('/').map(s => s.trim());
            
            let taskText = parts[0] || '';
            let isDone = false;
            
            if (taskText.startsWith('x ') || taskText.startsWith('X ')) {
              isDone = true;
              taskText = taskText.substring(2);
            }

            let assignee = '';
            let dueDate = '';

            for (let i = 1; i < parts.length; i++) {
              if (parts[i].startsWith('@')) {
                assignee = parts[i].substring(1).trim();
              } else if (parts[i].startsWith('E:')) {
                dueDate = parts[i].substring(2).trim();
              }
            }

            let cleanTag = currentTag ? (currentTag.startsWith('#') ? currentTag.substring(1) : currentTag) : '';
            let tagParts = cleanTag ? cleanTag.split('/') : [];

            todos.push({
              id: `${file.id}-line-${index}`,
              noteId: file.id,
              noteName: file.name,
              fullTag: currentTag || '#일반',
              categories: tagParts,
              task: taskText,
              assignee: assignee || '-',
              dueDate: dueDate || '-',
              createdDate: file.createdDate || '2026-11-02',
              isDone: isDone,
              rawLine: line
            });
          }
        });
      });

      return todos;
    }

    function updateTodoFilter(colIndex, value) {
      if (value === '') {
        delete state.todoFilters[colIndex];
      } else {
        state.todoFilters[colIndex] = value;
      }
      renderTodoDashboard();
    }

    function renderTodoDashboard() {
      const todos = parseTodos();
      const thead = document.getElementById('todo-table-head');
      const tbody = document.getElementById('todo-table-body');
      
      let maxDepth = 4;
      todos.forEach(t => {
        if (t.categories.length > maxDepth) {
          maxDepth = t.categories.length;
        }
      });

      let trHead = '<tr><th style="width: 40px;">완료</th>';
      for (let i = 0; i < maxDepth; i++) {
        const catName = `분류${i + 1}`;
        const currentVal = state.todoFilters[i] || '';
        
        const uniqueVals = [...new Set(todos.map(t => t.categories[i]).filter(v => v && v !== '-'))];
        
        let optionsHtml = `<option value="">전체</option>`;
        uniqueVals.forEach(v => {
          optionsHtml += `<option value="${v}" ${v === currentVal ? 'selected' : ''}>${v}</option>`;
        });

        trHead += `
          <th style="width: 110px;">
            ${catName}<br>
            <select class="table-filter-select" onchange="updateTodoFilter(${i}, this.value)">
              ${optionsHtml}
            </select>
          </th>
        `;
      }

      const fAssignee = state.todoFilters['assignee'] || '';
      const uniqueAssignees = [...new Set(todos.map(t => t.assignee).filter(v => v !== '-'))];
      let assigneeOptions = `<option value="">전체</option>`;
      uniqueAssignees.forEach(v => {
        assigneeOptions += `<option value="${v}" ${v === fAssignee ? 'selected' : ''}>${v}</option>`;
      });

      trHead += `
        <th>할 일 항목</th>
        <th style="width: 90px;">담당자<br><select class="table-filter-select" onchange="updateTodoFilter('assignee', this.value)">${assigneeOptions}</select></th>
        <th style="width: 100px;">종료 요청일</th>
        <th style="width: 100px;">생성 날짜</th>
        <th style="width: 120px;">출처 노트</th>
      </tr>`;
      thead.innerHTML = trHead;

      const filteredTodos = todos.filter(t => {
        for (let i = 0; i < maxDepth; i++) {
          if (state.todoFilters[i]) {
            if (t.categories[i] !== state.todoFilters[i]) return false;
          }
        }
        if (state.todoFilters['assignee'] && t.assignee !== state.todoFilters['assignee']) {
          return false;
        }
        return true;
      });

      tbody.innerHTML = '';
      if (filteredTodos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${maxDepth + 6}" style="text-align:center; color: var(--text-muted); padding: 24px;">등록된 TODO 항목이 없습니다.</td></tr>`;
        return;
      }

      filteredTodos.forEach(todo => {
        const tr = document.createElement('tr');
        
        let catTdHtml = '';
        for (let i = 0; i < maxDepth; i++) {
          const val = todo.categories[i];
          catTdHtml += `<td>${val ? `<span class="tag-badge">${val}</span>` : '-'}</td>`;
        }

        tr.innerHTML = `
          <td><input type="checkbox" class="todo-checkbox" ${todo.isDone ? 'checked' : ''} onchange="toggleTodoStatus('${todo.noteId}', '${todo.rawLine}', this.checked)"></td>
          ${catTdHtml}
          <td style="${todo.isDone ? 'text-decoration: line-through; opacity: 0.5;' : ''}">${todo.task}</td>
          <td class="todo-assignee">${todo.assignee !== '-' ? '@' + todo.assignee : '-'}</td>
          <td class="todo-date">${todo.dueDate}</td>
          <td class="todo-date">${todo.createdDate}</td>
          <td><span class="todo-note-link" onclick="selectNote('${todo.noteId}')">${todo.noteName}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleTodoStatus(noteId, rawLine, isChecked) {
      const note = findNode(state.tree, noteId);
      if (!note || !note.content) return;

      const lines = note.content.split('\n');
      const updatedLines = lines.map(line => {
        if (line.trim() === rawLine.trim()) {
          const match = line.match(/\[\s*(.*?)\s*\]/);
          if (match) {
            let inner = match[1];
            if (isChecked) {
              if (!inner.startsWith('x ')) inner = 'x ' + inner;
            } else {
              inner = inner.replace(/^x\s+/i, '');
            }
            return `[ ${inner} ]`;
          }
        }
        return line;
      });

      note.content = updatedLines.join('\n');
      saveData();
      renderTodoDashboard();
      if (state.activeNoteId === noteId) renderActiveNote();
    }

    function renderTreeNodes(nodes, filter = '') {
      const container = document.createElement('div');
      const sortedNodes = sortNodes(nodes);

      sortedNodes.forEach(node => {
        if (filter && node.type === 'file' && !node.name.toLowerCase().includes(filter)) {
          return;
        }

        const nodeEl = document.createElement('div');
        nodeEl.className = 'tree-node';

        if (node.type === 'folder') {
          const isSelected = state.selectedFolderId === node.id;
          
          nodeEl.innerHTML = `
            <div class="tree-row ${isSelected ? 'selected' : ''}" onclick="selectFolder('${node.id}')">
              <div class="node-title-group">
                <span class="toggle-icon" onclick="toggleFolder('${node.id}', event)">
                  <i class="fa-solid fa-chevron-${node.isOpen ? 'down' : 'right'}"></i>
                </span>
                <i class="fa-regular fa-folder node-icon"></i>
                <span>${node.name}</span>
              </div>
              <div class="node-actions">
                <button class="action-btn" title="폴더 이름 수정" onclick="renameFolder('${node.id}', event)"><i class="fa-solid fa-pen"></i></button>
                <button class="action-btn" title="서브폴더 추가" onclick="event.stopPropagation(); createFolder('${node.id}')"><i class="fa-solid fa-folder-plus"></i></button>
                <button class="action-btn" title="노트 추가" onclick="event.stopPropagation(); createNote('${node.id}')"><i class="fa-solid fa-plus"></i></button>
                <button class="action-btn delete" title="삭제" onclick="deleteNodeAction('${node.id}', event)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <div class="tree-children ${node.isOpen ? 'open' : ''}" id="children-${node.id}"></div>
          `;

          const childrenContainer = nodeEl.querySelector(`#children-${node.id}`);
          if (node.children && node.children.length > 0) {
            childrenContainer.appendChild(renderTreeNodes(node.children, filter));
          }
        } else {
          const isActive = state.activeNoteId === node.id;
          
          nodeEl.innerHTML = `
            <div class="tree-row ${isActive ? 'active-file' : ''}" onclick="selectNote('${node.id}')">
              <div class="node-title-group">
                <span class="toggle-icon"></span>
                <i class="fa-regular fa-file-lines node-icon"></i>
                <span>${node.name || '제목 없음'}</span>
              </div>
              <div class="node-actions">
                <button class="action-btn" title="다른 폴더로 이동" onclick="openMoveModal('${node.id}', event)"><i class="fa-solid fa-folder-open"></i></button>
                <button class="action-btn delete" title="노트 삭제" onclick="deleteNodeAction('${node.id}', event)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
          `;
        }

        container.appendChild(nodeEl);
      });

      return container;
    }

    function renderActiveNote() {
      const note = findNode(state.tree, state.activeNoteId);
      if (!note || note.type !== 'file') {
        document.getElementById('note-title-input').value = '';
        document.getElementById('textarea-editor').value = '';
        document.getElementById('current-path-label').textContent = 'Vault';
        renderTags();
        return;
      }

      document.getElementById('note-title-input').value = note.name;
      document.getElementById('textarea-editor').value = note.content || '';
      
      const parent = findParentNode(state.tree, note.id);
      document.getElementById('current-path-label').textContent = `${parent ? parent.name : 'Vault'} / ${note.name}`;

      renderTags();
      renderRightPanel();
    }

    function renderTags() {
      const note = findNode(state.tree, state.activeNoteId);
      const container = document.getElementById('tags-container');
      const input = document.getElementById('add-tag-input');
      
      container.querySelectorAll('.tag-chip').forEach(el => el.remove());

      if (note && note.tags) {
        note.tags.forEach((tag, idx) => {
          const chip = document.createElement('div');
          chip.className = 'tag-chip';
          chip.innerHTML = `#${tag} <i class="fa-solid fa-xmark" onclick="removeTag(${idx})"></i>`;
          container.insertBefore(chip, input);
        });
      }
    }

    function removeTag(index) {
      const note = findNode(state.tree, state.activeNoteId);
      if (note && note.tags) {
        note.tags.splice(index, 1);
        saveData();
        renderTags();
      }
    }

    function renderRightPanel() {
      const note = findNode(state.tree, state.activeNoteId);
      if (!note) return;

      const backlinksContainer = document.getElementById('backlinks-list');
      backlinksContainer.innerHTML = '';
      
      const searchTarget = `[[${note.name}]]`;
      const allFiles = getAllFiles();
      const backlinkNotes = allFiles.filter(n => n.id !== note.id && n.content && n.content.includes(searchTarget));

      if (backlinkNotes.length === 0) {
        backlinksContainer.innerHTML = '<li style="color: var(--text-muted); font-size: 12px;">역방향 링크가 없습니다.</li>';
      } else {
        backlinkNotes.forEach(bn => {
          const li = document.createElement('li');
          li.className = 'link-item';
          li.innerHTML = `<i class="fa-regular fa-file-lines"></i> ${bn.name}`;
          li.onclick = () => selectNote(bn.id);
          backlinksContainer.appendChild(li);
        });
      }

      const outlineContainer = document.getElementById('outline-list');
      outlineContainer.innerHTML = '';

      const lines = (note.content || '').split('\n');
      const headers = lines.filter(l => l.trim().startsWith('@'));

      if (headers.length === 0) {
        outlineContainer.innerHTML = '<li style="color: var(--text-muted); font-size: 12px;">헤더가 정의되지 않았습니다.</li>';
      } else {
        headers.forEach(h => {
          const trimmed = h.trim();
          let levelClass = '';
          
          if (trimmed.startsWith('@@@@')) {
            levelClass = 'outline-h4';
          } else if (trimmed.startsWith('@@@')) {
            levelClass = 'outline-h3';
          } else if (trimmed.startsWith('@@')) {
            levelClass = 'outline-h2';
          } else {
            levelClass = 'outline-h2';
          }

          const cleanText = trimmed.replace(/^@+\s*/, '');
          const li = document.createElement('li');
          li.className = `outline-item ${levelClass}`;
          li.textContent = cleanText;
          outlineContainer.appendChild(li);
        });
      }
    }

    function renderCalendar() {
      const date = state.currentCalDate;
      const year = date.getFullYear();
      const month = date.getMonth();

      document.getElementById('cal-month-year').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
      dayLabels.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'cal-day-label';
        lbl.textContent = d;
        grid.appendChild(lbl);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = day;

        if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
          cell.classList.add('today');
        }

        grid.appendChild(cell);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
