<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Style Workspace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-sidebar: #181818;
      --bg-header: #222222;
      --bg-hover: #2a2d2e;
      --bg-active: #37373d;
      --text-main: #dcddde;
      --text-muted: #8e8e93;
      --accent: #7f6df2;
      --border: #2d2d2d;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-family); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }
    .top-bar { height: 40px; background-color: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; color: var(--text-muted); }
    .top-bar-title { font-weight: 600; color: var(--text-main); }

    /* Left Sidebar */
    .left-sidebar { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 10px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
    .search-box { flex: 1; background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none; }
    .icon-btn { background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .icon-btn:hover { background: var(--bg-active); }

    /* Tree View */
    .file-tree { flex: 1; overflow-y: auto; padding: 8px 4px; }
    .tree-node { position: relative; user-select: none; }
    .tree-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; border-radius: 4px; font-size: 13px; cursor: pointer; color: var(--text-main); }
    .tree-row:hover { background-color: var(--bg-hover); }
    .tree-row.selected { background-color: rgba(127, 109, 242, 0.2); color: var(--text-main); }
    .tree-row.active-file { background-color: var(--bg-active); color: #fff; }

    .node-title-group { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .toggle-icon { width: 14px; text-align: center; color: var(--text-muted); font-size: 10px; cursor: pointer; }
    .node-icon { color: var(--text-muted); font-size: 12px; }

    .node-actions { display: flex; gap: 4px; opacity: 0; }
    .tree-row:hover .node-actions { opacity: 1; }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn.delete:hover { color: #ff5555; }

    .tree-children { padding-left: 14px; display: none; }
    .tree-children.open { display: block; }

    /* Main Editor */
    .main-editor { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .editor-toolbar { padding: 8px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .mode-toggle { display: flex; background: #252526; border-radius: 4px; padding: 2px; }
    .mode-btn { background: none; border: none; color: var(--text-muted); padding: 4px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; }
    .mode-btn.active { background: var(--accent); color: white; }

    .editor-content { flex: 1; display: flex; flex-direction: column; padding: 24px 40px; overflow-y: auto; }
    .note-title-input { background: none; border: none; font-size: 28px; font-weight: 700; color: var(--text-main); outline: none; margin-bottom: 16px; }
    
    .properties-panel { background: #252526; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 24px; font-size: 13px; }
    .prop-row { display: flex; align-items: center; gap: 12px; }
    .prop-key { color: var(--text-muted); width: 60px; font-weight: 500; }
    .tags-container { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag-chip { background: rgba(127, 109, 242, 0.2); color: var(--accent); padding: 2px 8px; border-radius: 12px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .tag-chip i { cursor: pointer; font-size: 10px; }
    .add-tag-input { background: none; border: none; color: var(--text-main); outline: none; font-size: 12px; width: 80px; }

    .textarea-editor { flex: 1; background: none; border: none; color: var(--text-main); font-family: var(--font-family); font-size: 15px; line-height: 1.6; resize: none; outline: none; min-height: 300px; }
    .markdown-preview { flex: 1; line-height: 1.6; display: none; }
    .markdown-preview a.wiki-link { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; }

    /* Right Sidebar */
    .right-sidebar { width: 280px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .calendar-widget { padding: 16px; border-bottom: 1px solid var(--border); }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
    .cal-day-label { color: var(--text-muted); padding-bottom: 4px; }
    .cal-cell { padding: 6px 0; border-radius: 4px; cursor: pointer; color: var(--text-main); }
    .cal-cell:hover { background: var(--bg-hover); }
    .cal-cell.today { background: var(--accent); color: white; font-weight: bold; }
    
    .panel-section { flex: 1; padding: 16px; overflow-y: auto; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .link-list, .outline-list { list-style: none; font-size: 13px; }
    .link-item, .outline-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-main); margin-bottom: 4px; }
    .link-item:hover, .outline-item:hover { background-color: var(--bg-hover); }
    .outline-h2 { padding-left: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-title"><i class="fa-solid fa-book-bookmark"></i> Obsidian Vault REV01 </div>
  </div>

  <div class="app-container">
    <div class="left-sidebar">
      <div class="sidebar-header">
        <input type="text" id="search-input" class="search-box" placeholder="검색...">
        <button id="add-root-folder" class="icon-btn" title="루트 폴더 추가"><i class="fa-solid fa-folder-plus"></i></button>
        <button id="add-note-btn" class="icon-btn" title="새 노트 추가"><i class="fa-solid fa-file-circle-plus"></i></button>
      </div>
      <div class="file-tree" id="file-tree"></div>
    </div>

    <div class="main-editor">
      <div class="editor-toolbar">
        <div style="font-size: 12px; color: var(--text-muted);" id="current-path-label">Vault</div>
        <div class="mode-toggle">
          <button class="mode-btn active" id="edit-mode-btn"><i class="fa-solid fa-pen"></i> 편집</button>
          <button class="mode-btn" id="preview-mode-btn"><i class="fa-solid fa-eye"></i> 보기</button>
        </div>
      </div>
      <div class="editor-content">
        <input type="text" id="note-title-input" class="note-title-input" placeholder="제목 없음">
        
        <div class="properties-panel">
          <div class="prop-row">
            <span class="prop-key">Tags</span>
            <div class="tags-container" id="tags-container">
              <input type="text" id="add-tag-input" class="add-tag-input" placeholder="+ 태그 추가">
            </div>
          </div>
        </div>

        <textarea id="textarea-editor" class="textarea-editor" placeholder="내용을 입력하세요..."></textarea>
        <div id="markdown-preview" class="markdown-preview"></div>
      </div>
    </div>

    <div class="right-sidebar">
      <div class="calendar-widget">
        <div class="cal-header">
          <button id="prev-month" class="icon-btn" style="padding: 2px 6px;"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="cal-month-year"></span>
          <button id="next-month" class="icon-btn" style="padding: 2px 6px;"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="panel-section" style="border-bottom: 1px solid var(--border);">
        <div class="section-title"><i class="fa-solid fa-link"></i> 역방향 링크</div>
        <ul class="link-list" id="backlinks-list"></ul>
      </div>

      <div class="panel-section">
        <div class="section-title"><i class="fa-solid fa-list-ul"></i> 개요</div>
        <ul class="outline-list" id="outline-list"></ul>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'obsidian_tree_vault_data';

    // Tree Structure State
    let state = {
      tree: [
        {
          id: 'folder-1',
          name: '1. Project',
          type: 'folder',
          isOpen: true,
          children: [
            {
              id: 'folder-1-1',
              name: 'Sub-Project',
              type: 'folder',
              isOpen: true,
              children: [
                {
                  id: 'note-1',
                  name: '프로젝트 개요',
                  type: 'file',
                  tags: ['프로젝트'],
                  content: '# 프로젝트 개요\n\n하위 폴더 내부에 위치한 노트입니다.'
                }
              ]
            }
          ]
        },
        {
          id: 'folder-2',
          name: '2. Resource',
          type: 'folder',
          isOpen: false,
          children: []
        }
      ],
      selectedFolderId: 'folder-1',
      activeNoteId: 'note-1',
      isPreview: false,
      currentCalDate: new Date()
    };

    function init() {
      loadData();
      bindEvents();
      renderFileTree();
      renderActiveNote();
      renderCalendar();
      renderRightPanel();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          state.tree = parsed.tree || state.tree;
          state.selectedFolderId = parsed.selectedFolderId || null;
          state.activeNoteId = parsed.activeNoteId || null;
        } catch (e) {}
      }
    }

    // Helper: Tree Traversals
    function findNode(nodes, id) {
      for (const node of nodes) {
        if (node.id === id) return node;
        if (node.type === 'folder' && node.children) {
          const found = findNode(node.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function findParentNode(nodes, targetId, parent = null) {
      for (const node of nodes) {
        if (node.id === targetId) return parent;
        if (node.type === 'folder' && node.children) {
          const found = findParentNode(node.children, targetId, node);
          if (found) return found;
        }
      }
      return null;
    }

    function removeNode(nodes, id) {
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].id === id) {
          nodes.splice(i, 1);
          return true;
        }
        if (nodes[i].type === 'folder' && nodes[i].children) {
          if (removeNode(nodes[i].children, id)) return true;
        }
      }
      return false;
    }

    function getAllFiles(nodes = state.tree) {
      let files = [];
      for (const node of nodes) {
        if (node.type === 'file') files.push(node);
        if (node.type === 'folder' && node.children) {
          files = files.concat(getAllFiles(node.children));
        }
      }
      return files;
    }

    function bindEvents() {
      document.getElementById('add-root-folder').addEventListener('click', () => createFolder(null));
      document.getElementById('add-note-btn').addEventListener('click', () => createNote(state.selectedFolderId));

      const titleInput = document.getElementById('note-title-input');
      const textEditor = document.getElementById('textarea-editor');

      titleInput.addEventListener('input', (e) => {
        const note = findNode(state.tree, state.activeNoteId);
        if (note) {
          note.name = e.target.value;
          saveData();
          renderFileTree();
        }
      });

      textEditor.addEventListener('input', (e) => {
        const note = findNode(state.tree, state.activeNoteId);
        if (note) {
          note.content = e.target.value;
          saveData();
          renderRightPanel();
        }
      });

      const tagInput = document.getElementById('add-tag-input');
      tagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && tagInput.value.trim() !== '') {
          const note = findNode(state.tree, state.activeNoteId);
          if (note) {
            if (!note.tags) note.tags = [];
            note.tags.push(tagInput.value.trim());
            tagInput.value = '';
            saveData();
            renderTags();
          }
        }
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        renderFileTree(e.target.value.toLowerCase());
      });

      document.getElementById('edit-mode-btn').addEventListener('click', () => setMode(false));
      document.getElementById('preview-mode-btn').addEventListener('click', () => setMode(true));

      document.getElementById('prev-month').addEventListener('click', () => {
        state.currentCalDate.setMonth(state.currentCalDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('next-month').addEventListener('click', () => {
        state.currentCalDate.setMonth(state.currentCalDate.getMonth() + 1);
        renderCalendar();
      });
    }

    // Node Operations
    function createFolder(parentId) {
      const name = prompt('새 폴더 이름을 입력하세요:');
      if (!name || name.trim() === '') return;

      const newFolder = {
        id: 'folder-' + Date.now(),
        name: name.trim(),
        type: 'folder',
        isOpen: true,
        children: []
      };

      if (parentId) {
        const parent = findNode(state.tree, parentId);
        if (parent && parent.type === 'folder') {
          parent.children.push(newFolder);
          parent.isOpen = true;
        }
      } else {
        state.tree.push(newFolder);
      }

      state.selectedFolderId = newFolder.id;
      saveData();
      renderFileTree();
    }

    function createNote(folderId) {
      const newNote = {
        id: 'note-' + Date.now(),
        name: '제목 없는 노트',
        type: 'file',
        tags: [],
        content: ''
      };

      let targetContainer = state.tree;
      if (folderId) {
        const targetFolder = findNode(state.tree, folderId);
        if (targetFolder && targetFolder.type === 'folder') {
          targetFolder.children.push(newNote);
          targetFolder.isOpen = true;
          targetContainer = null;
        }
      }

      if (targetContainer) {
        state.tree.push(newNote);
      }

      state.activeNoteId = newNote.id;
      saveData();
      renderFileTree();
      renderActiveNote();
    }

    function deleteNodeAction(id, event) {
      event.stopPropagation();
      const node = findNode(state.tree, id);
      if (!node) return;

      if (confirm(`'${node.name}' ${node.type === 'folder' ? '폴더 및 내부 하위 항목' : '노트'}을 삭제하시겠습니까?`)) {
        removeNode(state.tree, id);

        if (state.activeNoteId === id) {
          const allFiles = getAllFiles();
          state.activeNoteId = allFiles.length > 0 ? allFiles[0].id : null;
        }
        if (state.selectedFolderId === id) {
          state.selectedFolderId = null;
        }

        saveData();
        renderFileTree();
        renderActiveNote();
      }
    }

    function toggleFolder(folderId, event) {
      event.stopPropagation();
      const folder = findNode(state.tree, folderId);
      if (folder) {
        folder.isOpen = !folder.isOpen;
        saveData();
        renderFileTree();
      }
    }

    function selectFolder(folderId) {
      state.selectedFolderId = folderId;
      renderFileTree();
    }

    function selectNote(noteId) {
      state.activeNoteId = noteId;
      const parent = findParentNode(state.tree, noteId);
      if (parent) state.selectedFolderId = parent.id;
      renderFileTree();
      renderActiveNote();
    }

    // Render Tree Recursively
    function renderTreeNodes(nodes, filter = '') {
      const container = document.createElement('div');

      nodes.forEach(node => {
        if (filter && node.type === 'file' && !node.name.toLowerCase().includes(filter)) {
          return;
        }

        const nodeEl = document.createElement('div');
        nodeEl.className = 'tree-node';

        if (node.type === 'folder') {
          const isSelected = state.selectedFolderId === node.id;
          
          nodeEl.innerHTML = `
            <div class="tree-row ${isSelected ? 'selected' : ''}" onclick="selectFolder('${node.id}')">
              <div class="node-title-group">
                <span class="toggle-icon" onclick="toggleFolder('${node.id}', event)">
                  <i class="fa-solid fa-chevron-${node.isOpen ? 'down' : 'right'}"></i>
                </span>
                <i class="fa-regular fa-folder node-icon"></i>
                <span>${node.name}</span>
              </div>
              <div class="node-actions">
                <button class="action-btn" title="서브폴더 추가" onclick="event.stopPropagation(); createFolder('${node.id}')"><i class="fa-solid fa-folder-plus"></i></button>
                <button class="action-btn" title="노트 추가" onclick="event.stopPropagation(); createNote('${node.id}')"><i class="fa-solid fa-plus"></i></button>
                <button class="action-btn delete" title="삭제" onclick="deleteNodeAction('${node.id}', event)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <div class="tree-children ${node.isOpen ? 'open' : ''}" id="children-${node.id}"></div>
          `;

          const childrenContainer = nodeEl.querySelector(`#children-${node.id}`);
          if (node.children && node.children.length > 0) {
            childrenContainer.appendChild(renderTreeNodes(node.children, filter));
          }
        } else {
          const isActive = state.activeNoteId === node.id;
          
          nodeEl.innerHTML = `
            <div class="tree-row ${isActive ? 'active-file' : ''}" onclick="selectNote('${node.id}')">
              <div class="node-title-group">
                <span class="toggle-icon"></span>
                <i class="fa-regular fa-file-lines node-icon"></i>
                <span>${node.name || '제목 없음'}</span>
              </div>
              <div class="node-actions">
                <button class="action-btn delete" title="노트 삭제" onclick="deleteNodeAction('${node.id}', event)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
          `;
        }

        container.appendChild(nodeEl);
      });

      return container;
    }

    function renderFileTree(filter = '') {
      const treeContainer = document.getElementById('file-tree');
      treeContainer.innerHTML = '';
      treeContainer.appendChild(renderTreeNodes(state.tree, filter));
    }

    function renderActiveNote() {
      const note = findNode(state.tree, state.activeNoteId);
      if (!note || note.type !== 'file') {
        document.getElementById('note-title-input').value = '';
        document.getElementById('textarea-editor').value = '';
        document.getElementById('current-path-label').textContent = 'Vault';
        renderTags();
        return;
      }

      document.getElementById('note-title-input').value = note.name;
      document.getElementById('textarea-editor').value = note.content || '';
      
      const parent = findParentNode(state.tree, note.id);
      document.getElementById('current-path-label').textContent = `${parent ? parent.name : 'Vault'} / ${note.name}`;

      renderTags();
      renderRightPanel();

      if (state.isPreview) renderPreview();
    }

    function renderTags() {
      const note = findNode(state.tree, state.activeNoteId);
      const container = document.getElementById('tags-container');
      const input = document.getElementById('add-tag-input');
      
      container.querySelectorAll('.tag-chip').forEach(el => el.remove());

      if (note && note.tags) {
        note.tags.forEach((tag, idx) => {
          const chip = document.createElement('div');
          chip.className = 'tag-chip';
          chip.innerHTML = `#${tag} <i class="fa-solid fa-xmark" onclick="removeTag(${idx})"></i>`;
          container.insertBefore(chip, input);
        });
      }
    }

    function removeTag(index) {
      const note = findNode(state.tree, state.activeNoteId);
      if (note && note.tags) {
        note.tags.splice(index, 1);
        saveData();
        renderTags();
      }
    }

    function setMode(isPreview) {
      state.isPreview = isPreview;
      document.getElementById('edit-mode-btn').classList.toggle('active', !isPreview);
      document.getElementById('preview-mode-btn').classList.toggle('active', isPreview);

      const editor = document.getElementById('textarea-editor');
      const preview = document.getElementById('markdown-preview');

      if (isPreview) {
        editor.style.display = 'none';
        preview.style.display = 'block';
        renderPreview();
      } else {
        editor.style.display = 'block';
        preview.style.display = 'none';
      }
    }

    function renderPreview() {
      const note = findNode(state.tree, state.activeNoteId);
      if (!note) return;

      let parsedHTML = marked.parse(note.content || '');
      parsedHTML = parsedHTML.replace(/\[\[(.*?)\]\]/g, (match, p1) => {
        return `<a class="wiki-link" onclick="handleWikiLinkClick('${p1}')">${p1}</a>`;
      });

      document.getElementById('markdown-preview').innerHTML = parsedHTML;
    }

    function handleWikiLinkClick(title) {
      const allFiles = getAllFiles();
      const target = allFiles.find(n => n.name.toLowerCase() === title.toLowerCase());
      
      if (target) {
        selectNote(target.id);
      } else {
        createNote(state.selectedFolderId);
        const newNote = findNode(state.tree, state.activeNoteId);
        if (newNote) {
          newNote.name = title;
          newNote.content = `# ${title}\n\n역방향 링크 문서입니다.`;
          saveData();
          renderFileTree();
          renderActiveNote();
        }
      }
    }

    function renderRightPanel() {
      const note = findNode(state.tree, state.activeNoteId);
      if (!note) return;

      const backlinksContainer = document.getElementById('backlinks-list');
      backlinksContainer.innerHTML = '';
      
      const searchTarget = `[[${note.name}]]`;
      const allFiles = getAllFiles();
      const backlinkNotes = allFiles.filter(n => n.id !== note.id && n.content && n.content.includes(searchTarget));

      if (backlinkNotes.length === 0) {
        backlinksContainer.innerHTML = '<li style="color: var(--text-muted); font-size: 12px;">역방향 링크가 없습니다.</li>';
      } else {
        backlinkNotes.forEach(bn => {
          const li = document.createElement('li');
          li.className = 'link-item';
          li.innerHTML = `<i class="fa-regular fa-file-lines"></i> ${bn.name}`;
          li.onclick = () => selectNote(bn.id);
          backlinksContainer.appendChild(li);
        });
      }

      const outlineContainer = document.getElementById('outline-list');
      outlineContainer.innerHTML = '';

      const lines = (note.content || '').split('\n');
      const headers = lines.filter(l => l.startsWith('#'));

      if (headers.length === 0) {
        outlineContainer.innerHTML = '<li style="color: var(--text-muted); font-size: 12px;">헤더가 정의되지 않았습니다.</li>';
      } else {
        headers.forEach(h => {
          const isH2 = h.startsWith('##');
          const cleanText = h.replace(/^#+\s*/, '');
          const li = document.createElement('li');
          li.className = `outline-item ${isH2 ? 'outline-h2' : ''}`;
          li.textContent = cleanText;
          outlineContainer.appendChild(li);
        });
      }
    }

    function renderCalendar() {
      const date = state.currentCalDate;
      const year = date.getFullYear();
      const month = date.getMonth();

      document.getElementById('cal-month-year').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
      dayLabels.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'cal-day-label';
        lbl.textContent = d;
        grid.appendChild(lbl);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = day;

        if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
          cell.classList.add('today');
        }

        grid.appendChild(cell);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
