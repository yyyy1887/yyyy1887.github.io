<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Obsidian Workspace</title>
<style>
:root {
  --blue:#2563eb;
  --blue-light:#dbeafe;
  --bg:#f8fafc;
  --white:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --green:#059669;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
}
button,input,select,textarea { font:inherit; }
button {
  cursor:pointer;
  border:1px solid var(--border);
  background:white;
  color:inherit;
  border-radius:8px;
  padding:8px 12px;
}
button:hover { filter:brightness(.97); }
.primary { background:var(--blue);color:white;border-color:var(--blue); }
.green { background:#ecfdf5;color:#047857;border-color:#a7f3d0; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.hidden { display:none!important; }

header {
  min-height:64px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:5;
}
.brand { display:flex;align-items:center;gap:10px; }
.logo {
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;
  background:var(--blue);color:white;font-weight:bold;
}
.brand h1 { margin:0;font-size:15px; }
.brand p { margin:2px 0 0;font-size:11px;color:var(--muted); }
nav { display:flex;align-items:center;gap:4px; }
nav button {
  border:0;border-radius:0;background:transparent;
  padding:21px 12px;color:var(--muted);font-size:12px;
}
nav button.active {
  border-bottom:2px solid var(--blue);
  color:var(--blue);font-weight:bold;
}

main {
  max-width:1440px;margin:auto;padding:18px;
  display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;
}
.sidebar,.panel,.toolbar {
  background:white;border:1px solid var(--border);
  border-radius:12px;box-shadow:0 2px 7px #0f172a06;
}
.sidebar { padding:12px;align-self:start;min-height:400px; }
.sidebar select { width:100%;margin-bottom:10px; }
.date-list { display:grid;gap:4px; }
.date-item {
  display:block;width:100%;text-align:left;border:0;
  padding:8px;font-size:12px;color:var(--muted);
}
.date-item.active { background:var(--blue-light);color:#1d4ed8;font-weight:bold; }

.content { min-width:0;display:grid;gap:14px;align-content:start; }
.toolbar {
  padding:12px;display:flex;justify-content:flex-end;
  align-items:center;gap:8px;flex-wrap:wrap;
}
.spacer { flex:1; }
.panel { padding:15px;min-width:0; }
.panel-head {
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin-bottom:12px;
}
.panel-head h2 { font-size:14px;margin:0; }
.note-body {
  white-space:pre-wrap;overflow-wrap:anywhere;
  background:#f8fafc;border:1px solid #edf2f7;
  border-radius:9px;padding:14px;
  font:12px/1.9 ui-monospace,Consolas,monospace;
  min-height:100px;
}
.lower { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
.filters { display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px; }
.filters select {
  max-width:100%;min-width:0;padding:6px;
  border:1px solid var(--border);border-radius:7px;
  background:white;font-size:11px;
}
.table-wrap { overflow:auto; }
table { border-collapse:collapse;width:100%;font-size:11px; }
th,td {
  text-align:left;border-bottom:1px solid #edf2f7;
  padding:9px 6px;vertical-align:top;
}
th { color:var(--muted);font-weight:600;background:#f8fafc; }
td input { accent-color:var(--blue); }
.status {
  display:inline-block;border-radius:6px;padding:2px 6px;
  background:#dbeafe;color:#1d4ed8;white-space:nowrap;
}
.status.done { background:#d1fae5;color:#047857; }
.empty { padding:24px;text-align:center;color:#94a3b8; }

.modal-backdrop {
  position:fixed;inset:0;background:#0f172a80;
  display:grid;place-items:center;padding:16px;z-index:10;
}
.modal {
  width:min(900px,100%);max-height:94vh;overflow:auto;
  background:white;border-radius:14px;padding:18px;
}
.modal textarea {
  width:100%;min-height:55vh;resize:vertical;padding:12px;
  border:1px solid var(--border);border-radius:8px;
  font:12px/1.7 ui-monospace,Consolas,monospace;
}
.modal input {
  width:100%;padding:9px;border:1px solid var(--border);
  border-radius:8px;margin:5px 0 10px;
}
.modal-actions {
  display:flex;justify-content:space-between;gap:8px;
  margin-top:12px;flex-wrap:wrap;
}
.notice {
  background:#eff6ff;border:1px solid #bfdbfe;
  border-radius:8px;padding:10px;font-size:12px;
  color:#1e40af;margin-bottom:10px;
}
@media(max-width:900px) {
  header { height:auto;flex-wrap:wrap;padding:10px 14px; }
  nav { width:100%;overflow:auto; }
  nav button { padding:10px 12px;white-space:nowrap; }
  main { grid-template-columns:1fr;padding:10px; }
  .sidebar { min-height:0; }
  .date-list { display:flex;overflow:auto; }
  .date-item { width:auto;white-space:nowrap; }
  .lower { grid-template-columns:1fr; }
  .toolbar { justify-content:flex-start; }
}
@media(max-width:480px) {
  .brand h1 { font-size:13px; }
  .brand p { font-size:10px; }
  .toolbar button { flex:1;font-size:11px;padding:8px 5px; }
  .spacer { display:none; }
  .panel { padding:11px; }
  th,td { padding:8px 5px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">◈</div>
    <div>
      <h1>My Obsidian Workspace</h1>
      <p>Workd_data.md 문서 관리 · GitHub Sync</p>
    </div>
  </div>
  <nav>
    <button class="active" data-page="notes">▣ 노트 기록장</button>
    <button data-page="todo">☑ TODO 관리</button>
    <button data-page="hierarchy">▦ 계층 태그 표</button>
    <button id="lock-btn">♙ 잠금</button>
  </nav>
</header>

<main>
  <aside class="sidebar">
    <select id="date-select" aria-label="문서 날짜"></select>
    <div id="date-list" class="date-list"></div>
    <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
    <div class="small muted">GitHub 저장소</div>
    <div id="repo-label" class="small" style="margin:4px 0 10px">미설정</div>
    <button id="github-settings" style="width:100%">⚙ GitHub 연동 설정</button>
    <p class="small muted">토큰은 브라우저 세션에 보관됩니다.</p>
  </aside>

  <section class="content">
    <div class="toolbar">
      <span class="spacer"></span>
      <button class="green" id="sync-btn">↻ GitHub 동기화</button>
      <button id="new-date">＋ 새 날짜 문서</button>
      <button class="primary" id="edit-note">✎ 문서 편집</button>
    </div>

    <section id="page-notes" class="panel">
      <div class="panel-head">
        <h2 id="note-title">날짜 문서</h2>
        <span class="small muted" id="sync-status">로컬 미리보기</span>
      </div>
      <div id="note-body" class="note-body"></div>
    </section>

    <section id="page-todo" class="panel hidden">
      <div class="panel-head">
        <h2>☑ TODO 태스크 보관함</h2>
        <span class="small muted" id="todo-stats"></span>
      </div>
      <div class="filters">
        <select id="todo-assignee"><option value="ALL">전체 담당자</option></select>
        <select id="todo-requester"><option value="ALL">전체 요청자</option></select>
        <select id="todo-status">
          <option value="ALL">전체 상태</option>
          <option value="PENDING">진행중</option>
          <option value="COMPLETED">완료</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>완료</th><th>업무 내용</th><th>담당자</th>
            <th>요청자</th><th>종료일</th><th>등록일</th>
          </tr></thead>
          <tbody id="todo-body"></tbody>
        </table>
      </div>
    </section>

    <section id="page-hierarchy" class="panel hidden">
      <div class="panel-head">
        <h2>▦ 계층 태그 노션 표</h2>
        <button id="reset-filters">필터 초기화</button>
      </div>
      <div class="filters">
        <select id="f-status">
          <option value="ALL">전체 현황</option>
          <option>진행중</option><option>완료</option>
        </select>
        <select id="f-l1"><option value="ALL">전체 대분류</option></select>
        <select id="f-l2"><option value="ALL">전체 중분류</option></select>
        <select id="f-l3"><option value="ALL">전체 소분류</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>완료</th><th>이름 (할 일)</th><th>현황</th>
            <th>대분류</th><th>중분류</th><th>소분류</th>
          </tr></thead>
          <tbody id="hierarchy-body"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>

<div id="modal-host"></div>

<script>
const $ = id => document.getElementById(id);

let docs = {};
let activeDate = "";
let sha = null;
let repo = {
  owner:"",
  name:"",
  path:"Workd_data.md",
  branch:"main"
};
let token = sessionStorage.getItem("gh_token") || "";
let completed = JSON.parse(localStorage.getItem("ws_completed") || "{}");

const sample = `## 2026-10-29 (목) 업무 노트

#HYE/설계팀/인사평가
[인사평가 자료 제출 / @양승기 / E:2026-10-29 / @@김팀장]`;

function parseDocs(md) {
  docs = {};
  const sections = md.split(/(?=^##\s+\d{4}-\d{2}-\d{2})/gm);

  sections.forEach(section => {
    const match = section.match(/^##\s+(\d{4}-\d{2}-\d{2})/m);
    if (match) docs[match[1]] = section.trim();
  });

  if (!Object.keys(docs).length) {
    const date = new Date().toISOString().slice(0,10);
    docs[date] = md || `## ${date} 업무 노트`;
  }

  activeDate = Object.keys(docs).sort().reverse()[0];
  renderAll();
}

function unified() {
  return Object.keys(docs).sort().reverse()
    .map(date => docs[date].trim()).join("\n\n---\n\n");
}

function safe(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function todos() {
  const result = [];

  Object.entries(docs).forEach(([date, body]) => {
    let tag = "";

    body.split("\n").forEach((line, index) => {
      const text = line.trim();

      if (text.startsWith("#")) tag = text.split(/\s/)[0];

      const match = text.match(/^\[(.*?)\]$/);
      if (!match) return;

      const parts = match[1].split("/").map(x => x.trim());
      let assignee = "", requester = "", due = "";

      parts.slice(1).forEach(part => {
        if (part.startsWith("@@")) requester = part.slice(2).trim();
        else if (part.startsWith("@")) assignee = part.slice(1).trim();
        else if (/^E:/i.test(part)) due = part.slice(2).trim();
      });

      const levels = tag.replace(/^#/,"").split("/");
      const id = `${date}_${index}_${parts[0]}`;

      result.push({
        id,date,task:parts[0] || "업무 내용 없음",
        assignee,requester,due,tag,
        l1:levels[0] || "",
        l2:levels[1] || "",
        l3:levels[2] || "",
        done:!!completed[id]
      });
    });
  });

  return result;
}

function renderAll() {
  renderDates();
  $("note-title").textContent = `${activeDate || "날짜 미지정"} 문서 (Workd_data.md 연동)`;
  $("note-body").textContent = docs[activeDate] || "";
  renderTodos();
  renderHierarchy();
}

function renderDates() {
  const dates = Object.keys(docs).sort().reverse();

  $("date-select").innerHTML = dates.map(date =>
    `<option value="${safe(date)}" ${date===activeDate?"selected":""}>📅 ${safe(date)} 문서</option>`
  ).join("");

  $("date-list").innerHTML = dates.map(date =>
    `<button class="date-item ${date===activeDate?"active":""}" data-date="${safe(date)}">▣ ${safe(date)}</button>`
  ).join("");

  document.querySelectorAll("[data-date]").forEach(button => {
    button.onclick = () => {
      activeDate = button.dataset.date;
      renderAll();
    };
  });
}

function fillSelect(id, values, label) {
  const select = $(id);
  const old = select.value;
  select.innerHTML = `<option value="ALL">${label}</option>` +
    values.filter(Boolean).sort().map(value =>
      `<option value="${safe(value)}">${safe(value)}</option>`
    ).join("");

  if (values.includes(old)) select.value = old;
}

function toggleDone(id) {
  completed[id] = !completed[id];
  localStorage.setItem("ws_completed", JSON.stringify(completed));
  renderTodos();
  renderHierarchy();
}

function renderTodos() {
  const all = todos();

  fillSelect("todo-assignee",[...new Set(all.map(t=>t.assignee))],"전체 담당자");
  fillSelect("todo-requester",[...new Set(all.map(t=>t.requester))],"전체 요청자");

  const assignee = $("todo-assignee").value;
  const requester = $("todo-requester").value;
  const status = $("todo-status").value;

  const shown = all.filter(t =>
    (assignee==="ALL" || t.assignee===assignee) &&
    (requester==="ALL" || t.requester===requester) &&
    (status==="ALL" || (status==="COMPLETED")===t.done)
  );

  $("todo-stats").textContent =
    `전체 ${all.length}개 / 완료 ${all.filter(t=>t.done).length}개`;

  $("todo-body").innerHTML = shown.map(t => `
    <tr>
      <td><input type="checkbox" data-done="${safe(t.id)}" ${t.done?"checked":""}></td>
      <td>${safe(t.task)}<div class="small muted">${safe(t.tag)}</div></td>
      <td>${safe(t.assignee||"—")}</td>
      <td>${safe(t.requester||"—")}</td>
      <td>${safe(t.due||"—")}</td>
      <td>${safe(t.date)}</td>
    </tr>
  `).join("") || `<tr><td colspan="6" class="empty">등록된 TODO가 없습니다.</td></tr>`;

  document.querySelectorAll("[data-done]").forEach(box => {
    box.onchange = () => toggleDone(box.dataset.done);
  });
}

function renderHierarchy() {
  const all = todos();

  ["l1","l2","l3"].forEach((level,index) => {
    fillSelect("f-"+level,
      [...new Set(all.map(t=>t[level]))],
      ["전체 대분류","전체 중분류","전체 소분류"][index]
    );
  });

  const status = $("f-status").value;
  const filters = ["l1","l2","l3"].map(level=>$("f-"+level).value);

  const shown = all.filter(t =>
    (status==="ALL" || (status==="완료")===t.done) &&
    filters.every((value,index) =>
      value==="ALL" || t[["l1","l2","l3"][index]]===value
    )
  );

  $("hierarchy-body").innerHTML = shown.map(t => `
    <tr>
      <td><input type="checkbox" data-done="${safe(t.id)}" ${t.done?"checked":""}></td>
      <td>${safe(t.task)}</td>
      <td><span class="status ${t.done?"done":""}">${t.done?"완료":"진행중"}</span></td>
      <td>${safe(t.l1)}</td>
      <td>${safe(t.l2)}</td>
      <td>${safe(t.l3)}</td>
    </tr>
  `).join("") || `<tr><td colspan="6" class="empty">조건에 맞는 TODO가 없습니다.</td></tr>`;

  document.querySelectorAll("[data-done]").forEach(box => {
    box.onchange = () => toggleDone(box.dataset.done);
  });
}

function showModal(title, content) {
  $("modal-host").innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="panel-head">
          <h2>${title}</h2>
          <button id="close-modal">✕</button>
        </div>
        ${content}
      </div>
    </div>`;

  $("close-modal").onclick = () => $("modal-host").innerHTML = "";
}

$("edit-note").onclick = () => {
  showModal("마크다운 문서 편집", `
    <textarea id="edit-content">${safe(docs[activeDate]||"")}</textarea>
    <div class="modal-actions">
      <button id="delete-doc" style="color:#dc2626">이 날짜 문서 삭제</button>
      <div>
        <button id="cancel-edit">취소</button>
        <button class="primary" id="save-edit">저장</button>
      </div>
    </div>`);

  $("cancel-edit").onclick = () => $("modal-host").innerHTML = "";

  $("save-edit").onclick = () => {
    docs[activeDate] = $("edit-content").value;
    renderAll();
    $("modal-host").innerHTML = "";
  };

  $("delete-doc").onclick = () => {
    if (!confirm(`${activeDate} 문서를 삭제하시겠습니까?`)) return;

    delete docs[activeDate];
    const remaining = Object.keys(docs).sort().reverse();

    if (remaining.length) activeDate = remaining[0];
    else {
      const date = new Date().toISOString().slice(0,10);
      docs[date] = `## ${date} 업무 노트`;
      activeDate = date;
    }

    renderAll();
    $("modal-host").innerHTML = "";
  };
};

$("new-date").onclick = () => {
  const date = prompt("새 문서 날짜 (YYYY-MM-DD)",new Date().toISOString().slice(0,10));
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;

  if (!docs[date]) {
    docs[date] = `## ${date} 업무 노트\n\n#기본태그\n[새 할 일 입력 / @담당자]`;
  }

  activeDate = date;
  renderAll();
  $("edit-note").click();
};

document.querySelectorAll("nav [data-page]").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll("nav [data-page]").forEach(item =>
      item.classList.toggle("active",item===button)
    );

    ["notes","todo","hierarchy"].forEach(page =>
      $("page-"+page).classList.toggle("hidden",page!==button.dataset.page)
    );

    if (button.dataset.page==="todo") renderTodos();
    if (button.dataset.page==="hierarchy") renderHierarchy();
  };
});

$("date-select").onchange = event => {
  activeDate = event.target.value;
  renderAll();
};

["todo-assignee","todo-requester","todo-status"].forEach(id =>
  $(id).onchange = renderTodos
);

["f-status","f-l1","f-l2","f-l3"].forEach(id =>
  $(id).onchange = renderHierarchy
);

$("reset-filters").onclick = () => {
  ["f-status","f-l1","f-l2","f-l3"].forEach(id => $(id).value="ALL");
  renderHierarchy();
};

function githubSettings() {
  showModal("GitHub 저장소 연동", `
    <div class="notice">
      GitHub 토큰은 HTML 코드에 직접 입력하지 마세요.
      공개 홈페이지에서는 서버를 통한 안전한 인증 방식을 권장합니다.
    </div>
    <label class="small">GitHub 사용자명</label>
    <input id="gh-owner" value="${safe(repo.owner)}">
    <label class="small">저장소 이름</label>
    <input id="gh-name" value="${safe(repo.name)}">
    <label class="small">파일 경로</label>
    <input id="gh-path" value="${safe(repo.path)}">
    <label class="small">브랜치</label>
    <input id="gh-branch" value="${safe(repo.branch)}">
    <label class="small">GitHub 토큰</label>
    <input id="gh-token" type="password" placeholder="GitHub 토큰">
    <div class="modal-actions">
      <span class="small muted">토큰은 현재 브라우저 세션에 보관됩니다.</span>
      <button class="primary" id="save-gh">설정 저장</button>
    </div>
  `);

  $("save-gh").onclick = () => {
    repo = {
      owner:$("gh-owner").value.trim(),
      name:$("gh-name").value.trim(),
      path:$("gh-path").value.trim()||"Workd_data.md",
      branch:$("gh-branch").value.trim()||"main"
    };

    token = $("gh-token").value.trim();
    sessionStorage.setItem("gh_token",token);
    localStorage.setItem("ws_repo",JSON.stringify(repo));

    $("repo-label").textContent =
      repo.owner && repo.name ? repo.owner+"/"+repo.name : "미설정";

    $("sync-status").textContent = "GitHub 설정 저장됨";
    $("modal-host").innerHTML = "";
  };
}

$("github-settings").onclick = githubSettings;

async function syncGitHub() {
  if (!repo.owner || !repo.name || !token) {
    githubSettings();
    return;
  }

  const status = $("sync-status");
  status.textContent = "GitHub 연결 중…";

  const api = `https://api.github.com/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.name)}/contents/${repo.path.split("/").map(encodeURIComponent).join("/")}`;

  try {
    const response = await fetch(
      api+"?ref="+encodeURIComponent(repo.branch),
      {headers:{
        Authorization:"Bearer "+token,
        Accept:"application/vnd.github+json"
      }}
    );

    if (!response.ok) {
      throw new Error("GitHub 파일 확인 실패: "+response.status);
    }

    const data = await response.json();
    sha = data.sha;

    const current = decodeURIComponent(escape(atob(data.content.replace(/\n/g,""))));

    if (!confirm("GitHub의 최신 파일을 확인했습니다. 현재 웹 문서를 GitHub에 저장하시겠습니까?")) {
      parseDocs(current);
      status.textContent = "GitHub 파일 불러옴";
      return;
    }

    const payload = {
      message:"Update Workd_data.md",
      content:btoa(unescape(encodeURIComponent(unified()))),
      sha,
      branch:repo.branch
    };

    const saved = await fetch(api,{
      method:"PUT",
      headers:{
        Authorization:"Bearer "+token,
        Accept:"application/vnd.github+json",
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

    if (!saved.ok) throw new Error("GitHub 저장 실패: "+saved.status);

    status.textContent = "GitHub 저장 완료";
    alert("GitHub에 저장했습니다.");
  } catch(error) {
    status.textContent = "동기화 실패";
    alert("GitHub 연동 오류: "+error.message);
  }
}

$("sync-btn").onclick = syncGitHub;

$("lock-btn").onclick = () => {
  if (!confirm("워크스페이스 화면을 잠그시겠습니까?")) return;

  document.body.innerHTML = `
    <div style="min-height:100vh;display:grid;place-items:center;padding:20px">
      <div style="background:white;padding:28px;border:1px solid #ddd;border-radius:14px;max-width:360px;width:100%">
        <h2>Workspace 잠금</h2>
        <p>다시 열려면 페이지를 새로고침하세요.</p>
        <button onclick="location.reload()" class="primary">다시 열기</button>
      </div>
    </div>`;
};

try {
  repo = JSON.parse(localStorage.getItem("ws_repo")||"null") || repo;
} catch(error) {}

$("repo-label").textContent =
  repo.owner && repo.name ? repo.owner+"/"+repo.name : "미설정";

parseDocs(sample);
</script>
