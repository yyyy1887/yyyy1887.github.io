<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Style Workspace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-sidebar: #181818;
      --bg-header: #222222;
      --bg-hover: #2a2d2e;
      --bg-active: #37373d;
      --text-main: #dcddde;
      --text-muted: #8e8e93;
      --accent: #7f6df2;
      --border: #2d2d2d;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-family); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }
    .top-bar { height: 40px; background-color: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; color: var(--text-muted); }
    .top-bar-title { font-weight: 600; color: var(--text-main); }

    .left-sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
    .search-box { flex: 1; background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none; }
    .icon-btn { background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .icon-btn:hover { background: var(--bg-active); }

    .file-tree { flex: 1; overflow-y: auto; padding: 8px; }
    .folder-item { margin-bottom: 4px; }
    .folder-title { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-size: 13px; color: var(--text-muted); cursor: pointer; border-radius: 4px; font-weight: 600; }
    .folder-title:hover { background-color: var(--bg-hover); }
    .folder-title.selected { background-color: rgba(127, 109, 242, 0.15); color: var(--accent); }
    
    .folder-actions { display: flex; gap: 6px; opacity: 0; }
    .folder-title:hover .folder-actions { opacity: 1; }
    .folder-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; }
    .folder-action-btn:hover { color: var(--text-main); }
    .folder-action-btn.delete:hover { color: #ff5555; }

    .file-list { padding-left: 16px; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-size: 13px; color: var(--text-main); cursor: pointer; border-radius: 4px; }
    .file-item:hover { background-color: var(--bg-hover); }
    .file-item.active { background-color: var(--bg-active); color: #fff; }
    .delete-file-btn { display: none; color: #ff5555; background: none; border: none; cursor: pointer; font-size: 11px; }
    .file-item:hover .delete-file-btn { display: block; }

    .main-editor { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .editor-toolbar { padding: 8px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .mode-toggle { display: flex; background: #252526; border-radius: 4px; padding: 2px; }
    .mode-btn { background: none; border: none; color: var(--text-muted); padding: 4px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; }
    .mode-btn.active { background: var(--accent); color: white; }

    .editor-content { flex: 1; display: flex; flex-direction: column; padding: 24px 40px; overflow-y: auto; }
    .note-title-input { background: none; border: none; font-size: 28px; font-weight: 700; color: var(--text-main); outline: none; margin-bottom: 16px; }
    
    .properties-panel { background: #252526; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 24px; font-size: 13px; }
    .prop-row { display: flex; align-items: center; gap: 12px; }
    .prop-key { color: var(--text-muted); width: 60px; font-weight: 500; }
    .tags-container { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag-chip { background: rgba(127, 109, 242, 0.2); color: var(--accent); padding: 2px 8px; border-radius: 12px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .tag-chip i { cursor: pointer; font-size: 10px; }
    .add-tag-input { background: none; border: none; color: var(--text-main); outline: none; font-size: 12px; width: 80px; }

    .textarea-editor { flex: 1; background: none; border: none; color: var(--text-main); font-family: var(--font-family); font-size: 15px; line-height: 1.6; resize: none; outline: none; min-height: 300px; }
    .markdown-preview { flex: 1; line-height: 1.6; display: none; }
    .markdown-preview a.wiki-link { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; }

    .right-sidebar { width: 280px; background-color: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    .calendar-widget { padding: 16px; border-bottom: 1px solid var(--border); }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; }
    .cal-day-label { color: var(--text-muted); padding-bottom: 4px; }
    .cal-cell { padding: 6px 0; border-radius: 4px; cursor: pointer; color: var(--text-main); }
    .cal-cell:hover { background: var(--bg-hover); }
    .cal-cell.today { background: var(--accent); color: white; font-weight: bold; }
    
    .panel-section { flex: 1; padding: 16px; overflow-y: auto; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .link-list, .outline-list { list-style: none; font-size: 13px; }
    .link-item, .outline-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-main); margin-bottom: 4px; }
    .link-item:hover, .outline-item:hover { background-color: var(--bg-hover); }
    .outline-h2 { padding-left: 12px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-title"><i class="fa-solid fa-book-bookmark"></i> Obsidian Vault</div>
  </div>

  <div class="app-container">
    <div class="left-sidebar">
      <div class="sidebar-header">
        <input type="text" id="search-input" class="search-box" placeholder="문서 검색...">
        <button id="new-folder-btn" class="icon-btn" title="새 폴더 생성"><i class="fa-solid fa-folder-plus"></i></button>
        <button id="new-note-btn" class="icon-btn" title="선택된 폴더에 새 노트"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div class="file-tree" id="file-tree"></div>
    </div>

    <div class="main-editor">
      <div class="editor-toolbar">
        <div style="font-size: 12px; color: var(--text-muted);" id="current-folder-label">Folder / Note</div>
        <div class="mode-toggle">
          <button class="mode-btn active" id="edit-mode-btn"><i class="fa-solid fa-pen"></i> 편집</button>
          <button class="mode-btn" id="preview-mode-btn"><i class="fa-solid fa-eye"></i> 보기</button>
        </div>
      </div>
      <div class="editor-content">
        <input type="text" id="note-title-input" class="note-title-input" placeholder="제목 없음">
        
        <div class="properties-panel">
          <div class="prop-row">
            <span class="prop-key">Tags</span>
            <div class="tags-container" id="tags-container">
              <input type="text" id="add-tag-input" class="add-tag-input" placeholder="+ 태그 추가">
            </div>
          </div>
        </div>

        <textarea id="textarea-editor" class="textarea-editor" placeholder="내용을 입력하세요..."></textarea>
        <div id="markdown-preview" class="markdown-preview"></div>
      </div>
    </div>

    <div class="right-sidebar">
      <div class="calendar-widget">
        <div class="cal-header">
          <button id="prev-month" class="icon-btn" style="padding: 2px 6px;"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="cal-month-year"></span>
          <button id="next-month" class="icon-btn" style="padding: 2px 6px;"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="panel-section" style="border-bottom: 1px solid var(--border);">
        <div class="section-title"><i class="fa-solid fa-link"></i> 역방향 링크</div>
        <ul class="link-list" id="backlinks-list"></ul>
      </div>

      <div class="panel-section">
        <div class="section-title"><i class="fa-solid fa-list-ul"></i> 개요</div>
        <ul class="outline-list" id="outline-list"></ul>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'obsidian_web_vault_data';

    let state = {
      folders: ['0. Inbox', '1. Project', '2. Area', '3. Resource', '4. Archive'],
      selectedFolder: '0. Inbox',
      notes: [],
      activeNoteId: null,
      isPreview: false,
      currentCalDate: new Date()
    };

    function init() {
      loadData();
      if (state.folders.length === 0) {
        state.folders = ['0. Inbox'];
      }
      if (!state.selectedFolder || !state.folders.includes(state.selectedFolder)) {
        state.selectedFolder = state.folders[0];
      }
      if (state.notes.length === 0) {
        state.notes.push({
          id: Date.now().toString(),
          title: '시작하기',
          folder: state.selectedFolder,
          tags: ['환영', '가이드'],
          content: '# Obsidian 웹 작업 공간\n\n- 상단의 **폴더 플러스(+) 버튼**을 눌러 새 폴더를 추가할 수 있습니다.\n- 폴더 이름 오른쪽 아이콘을 이용해 폴더 삭제 및 노트를 빠르게 만들 수 있습니다.'
        });
      }
      if (!state.activeNoteId && state.notes.length > 0) {
        state.activeNoteId = state.notes[0].id;
      }

      bindEvents();
      renderFileTree();
      renderActiveNote();
      renderCalendar();
      renderRightPanel();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadData() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          state.folders = parsed.folders || state.folders;
          state.notes = parsed.notes || [];
        } catch (e) {}
      }
    }

    function bindEvents() {
      document.getElementById('new-folder-btn').addEventListener('click', createNewFolder);
      document.getElementById('new-note-btn').addEventListener('click', () => createNewNote(state.selectedFolder));
      
      const titleInput = document.getElementById('note-title-input');
      const textEditor = document.getElementById('textarea-editor');

      titleInput.addEventListener('input', (e) => {
        const note = getActiveNote();
        if (note) {
          note.title = e.target.value;
          saveData();
          renderFileTree();
        }
      });

      textEditor.addEventListener('input', (e) => {
        const note = getActiveNote();
        if (note) {
          note.content = e.target.value;
          saveData();
          renderRightPanel();
        }
      });

      const tagInput = document.getElementById('add-tag-input');
      tagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && tagInput.value.trim() !== '') {
          const note = getActiveNote();
          if (note) {
            if (!note.tags) note.tags = [];
            note.tags.push(tagInput.value.trim());
            tagInput.value = '';
            saveData();
            renderTags();
          }
        }
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        renderFileTree(e.target.value.toLowerCase());
      });

      document.getElementById('edit-mode-btn').addEventListener('click', () => setMode(false));
      document.getElementById('preview-mode-btn').addEventListener('click', () => setMode(true));

      document.getElementById('prev-month').addEventListener('click', () => {
        state.currentCalDate.setMonth(state.currentCalDate.getMonth() - 1);
        renderCalendar();
      });
      document.getElementById('next-month').addEventListener('click', () => {
        state.currentCalDate.setMonth(state.currentCalDate.getMonth() + 1);
        renderCalendar();
      });
    }

    function getActiveNote() {
      return state.notes.find(n => n.id === state.activeNoteId);
    }

    function selectFolder(folderName) {
      state.selectedFolder = folderName;
      renderFileTree();
    }

    function createNewFolder() {
      const folderName = prompt('생성할 폴더 이름을 입력하세요:');
      if (folderName && folderName.trim() !== '') {
        const trimmed = folderName.trim();
        if (!state.folders.includes(trimmed)) {
          state.folders.push(trimmed);
          state.selectedFolder = trimmed;
          saveData();
          renderFileTree();
        } else {
          alert('이미 존재하는 폴더 이름입니다.');
        }
      }
    }

    function deleteFolder(folderName, event) {
      event.stopPropagation();
      if (confirm(`'${folderName}' 폴더와 해당 폴더 안의 모든 노트를 삭제하시겠습니까?`)) {
        state.folders = state.folders.filter(f => f !== folderName);
        state.notes = state.notes.filter(n => n.folder !== folderName);
        
        if (state.selectedFolder === folderName) {
          state.selectedFolder = state.folders.length > 0 ? state.folders[0] : '';
        }
        
        if (getActiveNote() && getActiveNote().folder === folderName) {
          state.activeNoteId = state.notes.length > 0 ? state.notes[0].id : null;
        }

        saveData();
        renderFileTree();
        renderActiveNote();
      }
    }

    function createNewNote(targetFolder) {
      if (state.folders.length === 0) {
        alert('먼저 폴더를 생성해주세요.');
        return;
      }

      const folderName = targetFolder || state.selectedFolder || state.folders[0];
      const newNote = {
        id: Date.now().toString(),
        title: '제목 없는 노트',
        folder: folderName,
        tags: [],
        content: ''
      };
      state.notes.push(newNote);
      state.activeNoteId = newNote.id;
      state.selectedFolder = folderName;
      saveData();
      renderFileTree();
      renderActiveNote();
    }

    function deleteNote(id, event) {
      event.stopPropagation();
      state.notes = state.notes.filter(n => n.id !== id);
      if (state.activeNoteId === id) {
        state.activeNoteId = state.notes.length > 0 ? state.notes[0].id : null;
      }
      saveData();
      renderFileTree();
      renderActiveNote();
    }

    function setMode(isPreview) {
      state.isPreview = isPreview;
      document.getElementById('edit-mode-btn').classList.toggle('active', !isPreview);
      document.getElementById('preview-mode-btn').classList.toggle('active', isPreview);

      const editor = document.getElementById('textarea-editor');
      const preview = document.getElementById('markdown-preview');

      if (isPreview) {
        editor.style.display = 'none';
        preview.style.display = 'block';
        renderPreview();
      } else {
        editor.style.display = 'block';
        preview.style.display = 'none';
      }
    }

    function renderFileTree(filter = '') {
      const container = document.getElementById('file-tree');
      container.innerHTML = '';

      state.folders.forEach(folder => {
        const folderNotes = state.notes.filter(n => n.folder === folder && n.title.toLowerCase().includes(filter));
        const isSelected = state.selectedFolder === folder;

        const folderEl = document.createElement('div');
        folderEl.className = 'folder-item';
        
        folderEl.innerHTML = `
          <div class="folder-title ${isSelected ? 'selected' : ''}" onclick="selectFolder('${folder}')">
            <span><i class="fa-regular fa-folder"></i> ${folder}</span>
            <div class="folder-actions">
              <button class="folder-action-btn" title="이 폴더에 새 노트 생성" onclick="event.stopPropagation(); createNewNote('${folder}')">
                <i class="fa-solid fa-plus"></i>
              </button>
              <button class="folder-action-btn delete" title="폴더 삭제" onclick="deleteFolder('${folder}', event)">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="file-list">
            ${folderNotes.map(n => `
              <div class="file-item ${n.id === state.activeNoteId ? 'active' : ''}" onclick="selectNote('${n.id}')">
                <span><i class="fa-regular fa-file-lines"></i> ${n.title || '제목 없음'}</span>
                <button class="delete-file-btn" onclick="deleteNote('${n.id}', event)"><i class="fa-solid fa-xmark"></i></button>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(folderEl);
      });
    }

    function selectNote(id) {
      state.activeNoteId = id;
      const note = getActiveNote();
      if (note) state.selectedFolder = note.folder;
      renderFileTree();
      renderActiveNote();
    }

    function renderActiveNote() {
      const note = getActiveNote();
      if (!note) {
        document.getElementById('note-title-input').value = '';
        document.getElementById('textarea-editor').value = '';
        document.getElementById('current-folder-label').textContent = '';
        renderTags();
        return;
      }

      document.getElementById('note-title-input').value = note.title;
      document.getElementById('textarea-editor').value = note.content;
      document.getElementById('current-folder-label').textContent = `${note.folder} / ${note.title}`;

      renderTags();
      renderRightPanel();

      if (state.isPreview) {
        renderPreview();
      }
    }

    function renderTags() {
      const note = getActiveNote();
      const container = document.getElementById('tags-container');
      const input = document.getElementById('add-tag-input');
      
      container.querySelectorAll('.tag-chip').forEach(el => el.remove());

      if (note && note.tags) {
        note.tags.forEach((tag, idx) => {
          const chip = document.createElement('div');
          chip.className = 'tag-chip';
          chip.innerHTML = `#${tag} <i class="fa-solid fa-xmark" onclick="removeTag(${idx})"></i>`;
          container.insertBefore(chip, input);
        });
      }
    }

    function removeTag(index) {
      const note = getActiveNote();
      if (note && note.tags) {
        note.tags.splice(index, 1);
        saveData();
        renderTags();
      }
    }

    function renderPreview() {
      const note = getActiveNote();
      if (!note) return;

      let parsedHTML = marked.parse(note.content || '');
      parsedHTML = parsedHTML.replace(/\[\[(.*?)\]\]/g, (match, p1) => {
        return `<a class="wiki-link" onclick="handleWikiLinkClick('${p1}')">${p1}</a>`;
      });

      document.getElementById('markdown-preview').innerHTML = parsedHTML;
    }

    function handleWikiLinkClick(title) {
      const target = state.notes.find(n => n.title.toLowerCase() === title.toLowerCase());
      if (target) {
        selectNote(target.id);
      } else {
        const newNote = {
          id: Date.now().toString(),
          title: title,
          folder: state.selectedFolder || (state.folders.length > 0 ? state.folders[0] : '0. Inbox'),
          tags: [],
          content: `# ${title}\n\n역방향 링크로 생성된 문서입니다.`
        };
        state.notes.push(newNote);
        state.activeNoteId = newNote.id;
        saveData();
        renderFileTree();
        renderActiveNote();
      }
    }

    function renderRightPanel() {
      const note = getActiveNote();
      if (!note) return;

      const backlinksContainer = document.getElementById('backlinks-list');
      backlinksContainer.innerHTML = '';
      
      const searchTarget = `[[${note.title}]]`;
      const backlinkNotes = state.notes.filter(n => n.id !== note.id && n.content.includes(searchTarget));

      if (backlinkNotes.length === 0) {
        backlinksContainer.innerHTML = '<li style="color: var(--text-muted); font-size: 12px;">역방향 링크가 없습니다.</li>';
      } else {
        backlinkNotes.forEach(bn => {
          const li = document.createElement('li');
          li.className = 'link-item';
          li.innerHTML = `<i class="fa-regular fa-file-lines"></i> ${bn.title}`;
          li.onclick = () => selectNote(bn.id);
          backlinksContainer.appendChild(li);
        });
      }

      const outlineContainer = document.getElementById('outline-list');
      outlineContainer.innerHTML = '';

      const lines = note.content.split('\n');
      const headers = lines.filter(l => l.startsWith('#'));

      if (headers.length === 0) {
        outlineContainer.innerHTML = '<li style="color: var(--text-muted); font-size: 12px;">헤더가 정의되지 않았습니다.</li>';
      } else {
        headers.forEach(h => {
          const isH2 = h.startsWith('##');
          const cleanText = h.replace(/^#+\s*/, '');
          const li = document.createElement('li');
          li.className = `outline-item ${isH2 ? 'outline-h2' : ''}`;
          li.textContent = cleanText;
          outlineContainer.appendChild(li);
        });
      }
    }

    function renderCalendar() {
      const date = state.currentCalDate;
      const year = date.getFullYear();
      const month = date.getMonth();

      document.getElementById('cal-month-year').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
      dayLabels.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'cal-day-label';
        lbl.textContent = d;
        grid.appendChild(lbl);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = day;

        if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
          cell.classList.add('today');
        }

        grid.appendChild(cell);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
