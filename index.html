<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Style Workspace (REV 1.16)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-sidebar: #181818;
      --bg-header: #222222;
      --bg-hover: #2a2d2e;
      --bg-active: #37373d;
      --text-main: #dcddde;
      --text-muted: #8e8e93;
      --accent: #7f6df2;
      --accent-hover: #6b56eb;
      --border: #2d2d2d;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-family); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Login Screen Overlay */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #181818; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .auth-card { background: #252526; border: 1px solid var(--border); border-radius: 8px; padding: 32px; width: 360px; text-align: center; }
    .auth-card h2 { margin-bottom: 16px; font-size: 20px; color: var(--text-main); }
    .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .auth-card input { width: 100%; background: #1e1e1e; border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 4px; font-size: 14px; outline: none; margin-bottom: 16px; text-align: center; }
    .auth-card button { width: 100%; background: var(--accent); border: none; color: white; padding: 10px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .auth-card button:hover { background: var(--accent-hover); }

    .app-container { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }
    
    .top-bar { height: 40px; background-color: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
    .top-bar-left { display: flex; align-items: center; gap: 16px; }
    .top-bar-right { display: flex; align-items: center; gap: 8px; }
    .top-bar-title { font-weight: 600; color: var(--text-main); }
    
    .top-tabs { display: flex; gap: 4px; }
    .top-tab-btn { background: none; border: none; color: var(--text-muted); padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 6px; }
    .top-tab-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
    .top-tab-btn.active { background-color: var(--accent); color: white; }

    .gh-btn { background: #238636; border: 1px solid #2ea043; color: white; padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .gh-btn:hover { background: #2ea043; }
    
    .batch-tag-btn { background: #333; border: 1px solid var(--border); color: var(--text-main); padding: 4px 10px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .batch-tag-btn:hover { background: var(--bg-active); }

    .github-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .github-modal-content { background: #252526; border: 1px solid var(--border); border-radius: 8px; padding: 24px; width: 440px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input { width: 100%; background: #1e1e1e; border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; font-size: 13px; outline: none; }

    .left-sidebar { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 8px 10px; display: flex; gap: 4px; border-bottom: 1px solid var(--border); align-items: center; }
    .search-box { flex: 1; background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 8px; border-radius: 4px; font-size: 12px; outline: none; min-width: 0; }
    .sort-select { background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 5px; border-radius: 4px; font-size: 11px; outline: none; cursor: pointer; }
    .icon-btn { background: #252526; border: 1px solid var(--border); color: var(--text-main); padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .icon-btn:hover { background: var(--bg-active); }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 8px 4px; }
    .sidebar-footer { display: flex; border-top: 1px solid var(--border); background: var(--bg-header); }
    .sidebar-tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .sidebar-tab-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .sidebar-tab-btn.active { background: var(--accent); color: white; }

    .tree-node { position: relative; user-select: none; }
    .tree-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-radius: 4px; font-size: 13px; cursor: pointer; color: var(--text-main); }
    .tree-row:hover { background-color: var(--bg-hover); }
    .tree-row.selected { background-color: rgba(127, 109, 242, 0.2); color: var(--text-main); }
    .tree-row.active-file { background-color: var(--bg-active); color: #fff; }

    .node-title-group { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .toggle-icon { width: 16px; text-align: center; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .node-icon { color: var(--text-muted); font-size: 12px; }

    .node-actions { display: flex; gap: 4px; opacity: 0; }
    .tree-row:hover .node-actions { opacity: 1; }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn.delete:hover { color: #ff5555; }

    .tree-children { padding-left: 14px; display: none; }
    .tree-children.open { display: block; }

    .view-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; position: relative; }

    .main-editor { flex: 1; display: flex; flex-direction: column; height: 100%; padding: 24px 40px; overflow-y: auto; }
    .note-title-input { background: none; border: none; font-size: 28px; font-weight: 700; color: var(--text-main); outline: none; margin-bottom: 16px; width: 100%; }
    
    .properties-panel { background: #252526; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 24px; font-size: 13px; }
    .prop-row { display: flex; align-items: center; gap: 12px; }
    .prop-key { color: var(--text-muted); width: 60px; font-weight: 500; }
    .tags-container { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    
    .tag-chip { background: #e0f0ff; color: #0277bd; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #b3e5fc; }
    .tag-chip i { cursor: pointer; font-size: 10px; }
    .add-tag-input { background: none; border: none; color: var(--text-main); outline: none; font-size: 12px; width: 80px; }

    /* Single Plain Textarea Structure (REV 1.16 Standard) */
    .editor-wrapper { flex: 1; position: relative; display: flex; flex-direction: column; min-height: 300px; }
    .textarea-editor { width: 100%; height: 100%; background: transparent; border: none; color: var(--text-main); font-family: var(--font-family); font-size: 15px; line-height: 1.6; resize: none; outline: none; tab-size: 2; white-space: pre-wrap; word-break: break-all; overflow-y: auto; padding: 0; margin: 0; }

    .hashtag-agg-container { flex: 1; padding: 24px 32px; overflow-y: auto; display: none; }
    .agg-header { font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: var(--accent); }
    .agg-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #252526; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .agg-table th, .agg-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    .agg-table th { background: #222; color: var(--text-muted); font-weight: 600; }
    .agg-note-title { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; white-space: nowrap; }
    .agg-note-title:hover { color: var(--accent-hover); }
    .agg-content-block { line-height: 1.6; color: var(--text-main); white-space: pre-wrap; font-family: var(--font-family); }

    .todo-dashboard { flex: 1; padding: 24px 32px; overflow-y: auto; display: none; }
    .todo-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .todo-title { font-size: 24px; font-weight: 700; }

    .todo-list-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    .todo-list-table th, .todo-list-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .todo-list-table th { background: #252526; color: var(--text-muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
    
    .table-filter-select { background: #1e1e1e; border: 1px solid var(--border); color: var(--text-main); padding: 4px 6px; border-radius: 4px; font-size: 11px; outline: none; width: 100%; margin-top: 4px; cursor: pointer; }

    .tag-badge { background: rgba(127, 109, 242, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; }

    .todo-assignee { color: #4db6ac; font-weight: 500; }
    .todo-date { color: var(--text-muted); font-size: 12px; }
    .todo-note-link { color: var(--text-main); text-decoration: underline; cursor: pointer; }
    .todo-note-link:hover { color: var(--accent); }
    .todo-checkbox { cursor: pointer; width: 16px; height: 16px; accent-color: var(--accent); }

    .revision-dashboard { flex: 1; padding: 32px 40px; overflow-y: auto; display: none; }
    .revision-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
