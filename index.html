<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옵시디언 & 노션 스타일 계층형 노트 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .filter-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex justify-between items-center h-16">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-lg">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
                <div>
                    <h1 class="font-bold text-gray-900 text-lg leading-tight">My Workspace</h1>
                    <p class="text-xs text-gray-500">Obsidian & Notion Hybrid Note System</p>
                </div>
            </div>

            <!-- Page Navigation Tabs -->
            <nav class="flex space-x-2 sm:space-x-6 text-sm font-medium text-gray-600">
                <button onclick="switchPage('notes')" id="nav-notes" class="tab-btn active py-5 px-1 flex items-center gap-2">
                    <i class="fa-solid fa-note-sticky"></i>
                    <span>노트 보관함</span>
                </button>
                <button onclick="switchPage('hierarchy')" id="nav-hierarchy" class="tab-btn py-5 px-1 flex items-center gap-2">
                    <i class="fa-solid fa-sitemap"></i>
                    <span>계층 필터 탐색</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">

        <!-- ================= PAGE 1: NOTE LIST & CREATOR ================= -->
        <section id="page-notes" class="space-y-6">
            <!-- Controls Bar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="relative flex-1 w-full sm:w-auto">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="search-input" oninput="renderNotesPage()" placeholder="제목, 본문 또는 #태그 검색..." 
                        class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button onclick="openNoteModal()" class="w-full sm:w-auto bg-blue-600 text-white font-medium px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>새 노트 작성</span>
                </button>
            </div>

            <!-- Note Cards Grid -->
            <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic Note Cards Inserted Here -->
            </div>
        </section>


        <!-- ================= PAGE 2: HIERARCHY FILTER EXPLORER ================= -->
        <section id="page-hierarchy" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-blue-600"></i> 계층 태그 탐색기
                    </h2>
                    <p class="text-sm text-gray-500 mt-1">#대분류 / 중분류 / 소분류 버튼을 순서대로 선택하여 관련 노트를 빠르게 찾아보세요.</p>
                </div>

                <!-- Step 1: Category (대분류) -->
                <div class="space-y-2">
                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center justify-between">
                        <span>1단계: 대분류 (Category)</span>
                        <button onclick="resetHierarchyFilter()" class="text-blue-600 hover:underline normal-case text-xs">필터 초기화</button>
                    </div>
                    <div id="hierarchy-l1-buttons" class="flex flex-wrap gap-2">
                        <!-- Dynamic L1 Buttons -->
                    </div>
                </div>

                <!-- Step 2: Sub-Category (중분류) -->
                <div id="hierarchy-l2-wrapper" class="space-y-2 pt-4 border-t border-gray-100 hidden">
                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <span>2단계: 중분류 (Sub-Category)</span>
                    </div>
                    <div id="hierarchy-l2-buttons" class="flex flex-wrap gap-2">
                        <!-- Dynamic L2 Buttons -->
                    </div>
                </div>

                <!-- Step 3: Sub-Sub-Category (소분류) -->
                <div id="hierarchy-l3-wrapper" class="space-y-2 pt-4 border-t border-gray-100 hidden">
                    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <span>3단계: 소분류 (Detail Tag)</span>
                    </div>
                    <div id="hierarchy-l3-buttons" class="flex flex-wrap gap-2">
                        <!-- Dynamic L3 Buttons -->
                    </div>
                </div>
            </div>

            <!-- Filter Status & Filtered Note Results -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <div class="text-sm font-medium text-gray-700" id="filter-path-display">
                        조회 중: <span class="text-blue-600 font-bold">전체 노트</span>
                    </div>
                    <div class="text-xs text-gray-500" id="hierarchy-result-count">총 0개 노트</div>
                </div>

                <div id="hierarchy-notes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Dynamic Filtered Results -->
                </div>
            </div>
        </section>

    </main>

    <!-- Note Create/Edit Modal -->
    <div id="note-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-900 text-lg" id="modal-title">새 노트 작성</h3>
                <button onclick="closeNoteModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="note-form" onsubmit="handleSaveNote(event)" class="space-y-4">
                <input type="hidden" id="modal-note-id">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">제목</label>
                    <input type="text" id="modal-note-title" placeholder="노트 제목 입력" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">
                        본문 내용 (계층태그 포함 가능)
                    </label>
                    <textarea id="modal-note-content" rows="8" placeholder="예시:&#10;#RP/SEC/SC-1신규시스템&#10;- 1일 사용량 리포트 제공 필요&#10;- 바디 사이즈 검토 제공 필요" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    <p class="text-xs text-gray-400 mt-1">💡 <code>#대분류/중분류/소분류</code> 형식으로 적으시면 계층 필터에 자동 등록됩니다.</p>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeNoteModal()" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-50">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Initial Sample Data based on user obsidian records
        const initialNotes = [
            {
                id: 1,
                title: "SC-1 신규 시스템 리포트 및 검토",
                content: "#RP/SEC/SC-1신규시스템\n- [x] 1일 사용량 리포트 제공 필요 / 2026-07-23\n- [x] 바디 사이즈 검토 제공 필요 / 2026-07-23\n- [ ] Mixing Time Table 제공 필요",
                createdAt: "2026-07-23"
            },
            {
                id: 2,
                title: "P1L 폐황산 모디파이 검토",
                content: "#RP/SEC/P1L_폐황산모디파이\n- 내부 순환 시스템으로 제안 확정\n- 원심펌프 1대만 설치 한다.",
                createdAt: "2026-07-23"
            },
            {
                id: 3,
                title: "장비 파트 수량 정리",
                content: "#RP/HYE\n- [ ] 장비에 파트 수량 정리하기 - 김성기 수석님",
                createdAt: "2026-07-22"
            },
            {
                id: 4,
                title: "Pipe Type 3D Modeling 과제",
                content: "#PJT/SKH/PipeType3DModeling\n- 3D 배관 모델링 가이드라인 작성 및 1차 파이프라인 검토 완료",
                createdAt: "2026-07-20"
            },
            {
                id: 5,
                title: "EC-Mixing 및 주간 회의",
                content: "#MT/주간공정회의/TD\n- EC-Mixing 신규 컨셉 현장 미팅 진행\n- 부품비파괴검사표시 관련 이슈 검토",
                createdAt: "2026-07-23"
            }
        ];

        let notes = JSON.parse(localStorage.getItem('obsidian_hierarchy_notes')) || initialNotes;
        
        // Active Filter States
        let activeL1 = null;
        let activeL2 = null;
        let activeL3 = null;

        // Save Notes to LocalStorage
        function saveNotes() {
            localStorage.setItem('obsidian_hierarchy_notes', JSON.stringify(notes));
        }

        // Switch Top Pages
        function switchPage(page) {
            document.getElementById('page-notes').classList.toggle('hidden', page !== 'notes');
            document.getElementById('page-hierarchy').classList.toggle('hidden', page !== 'hierarchy');
            
            document.getElementById('nav-notes').classList.toggle('active', page === 'notes');
            document.getElementById('nav-hierarchy').classList.toggle('active', page === 'hierarchy');

            if (page === 'notes') renderNotesPage();
            if (page === 'hierarchy') renderHierarchyPage();
        }

        // Parse Hashtags and Hierarchy
        function extractHashtags(text) {
            const matches = text.match(/#[^\s#]+/g);
            return matches ? [...new Set(matches)] : [];
        }

        // Parse a Tag string into parts: #RP/SEC/SC-1 -> ['#RP', '#RP/SEC', '#RP/SEC/SC-1']
        function parseTagHierarchy(tagStr) {
            const clean = tagStr.replace('#', '');
            const parts = clean.split('/');
            
            const result = {};
            if (parts[0]) result.l1 = '#' + parts[0];
            if (parts[1]) result.l2 = result.l1 + '/' + parts[1];
            if (parts[2]) result.l3 = result.l2 + '/' + parts[2];

            return result;
        }

        // Render Main Notes Page
        function renderNotesPage() {
            const grid = document.getElementById('notes-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(search) || 
                n.content.toLowerCase().includes(search)
            );

            filtered.forEach(note => {
                grid.appendChild(createNoteCard(note));
            });
        }

        // Helper: Create HTML Note Card
        function createNoteCard(note) {
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition space-y-3 flex flex-col justify-between";
            
            const tags = extractHashtags(note.content);
            let tagsHtml = tags.map(t => `<span class="text-xs px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-semibold">${t}</span>`).join(' ');

            card.innerHTML = `
                <div class="space-y-2">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-gray-900 text-base line-clamp-1">${escapeHtml(note.title)}</h3>
                        <span class="text-xs text-gray-400">${note.createdAt}</span>
                    </div>
                    <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                    <p class="text-sm text-gray-600 font-mono whitespace-pre-line line-clamp-4 bg-gray-50 p-2.5 rounded-lg border border-gray-100">${escapeHtml(note.content)}</p>
                </div>
                <div class="flex justify-end gap-3 pt-2 border-t border-gray-100 text-xs text-gray-500">
                    <button onclick="editNote(${note.id})" class="hover:text-blue-600"><i class="fa-solid fa-pen"></i> 수정</button>
                    <button onclick="deleteNote(${note.id})" class="hover:text-red-600"><i class="fa-solid fa-trash"></i> 삭제</button>
                </div>
            `;
            return card;
        }

        // ================= HIERARCHY PAGE RENDER ENGINE =================
        function renderHierarchyPage() {
            // Build Hierarchy Tree from Notes
            const tree = {}; // { "#RP": { "#RP/SEC": ["#RP/SEC/SC-1", "#RP/SEC/P1L"] } }

            notes.forEach(note => {
                const tags = extractHashtags(note.content);
                tags.forEach(t => {
                    const parsed = parseTagHierarchy(t);
                    if (parsed.l1) {
                        if (!tree[parsed.l1]) tree[parsed.l1] = {};
                        if (parsed.l2) {
                            if (!tree[parsed.l1][parsed.l2]) tree[parsed.l1][parsed.l2] = new Set();
                            if (parsed.l3) tree[parsed.l1][parsed.l2].add(parsed.l3);
                        }
                    }
                });
            });

            // 1. Render L1 Buttons
            const l1Container = document.getElementById('hierarchy-l1-buttons');
            l1Container.innerHTML = '';
            Object.keys(tree).sort().forEach(l1 => {
                const btn = document.createElement('button');
                btn.className = `filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border ${activeL1 === l1 ? 'active' : 'bg-gray-100 text-gray-700 border-gray-200 hover:bg-gray-200'}`;
                btn.innerText = l1;
                btn.onclick = () => selectL1(l1);
                l1Container.appendChild(btn);
            });

            // 2. Render L2 Buttons if L1 Selected
            const l2Wrapper = document.getElementById('hierarchy-l2-wrapper');
            const l2Container = document.getElementById('hierarchy-l2-buttons');
            l2Container.innerHTML = '';

            if (activeL1 && tree[activeL1] && Object.keys(tree[activeL1]).length > 0) {
                l2Wrapper.classList.remove('hidden');
                Object.keys(tree[activeL1]).sort().forEach(l2 => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border ${activeL2 === l2 ? 'active' : 'bg-gray-100 text-gray-700 border-gray-200 hover:bg-gray-200'}`;
                    btn.innerText = l2;
                    btn.onclick = () => selectL2(l2);
                    l2Container.appendChild(btn);
                });
            } else {
                l2Wrapper.classList.add('hidden');
            }

            // 3. Render L3 Buttons if L2 Selected
            const l3Wrapper = document.getElementById('hierarchy-l3-wrapper');
            const l3Container = document.getElementById('hierarchy-l3-buttons');
            l3Container.innerHTML = '';

            if (activeL1 && activeL2 && tree[activeL1][activeL2] && tree[activeL1][activeL2].size > 0) {
                l3Wrapper.classList.remove('hidden');
                Array.from(tree[activeL1][activeL2]).sort().forEach(l3 => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold border ${activeL3 === l3 ? 'active' : 'bg-gray-100 text-gray-700 border-gray-200 hover:bg-gray-200'}`;
                    btn.innerText = l3;
                    btn.onclick = () => selectL3(l3);
                    l3Container.appendChild(btn);
                });
            } else {
                l3Wrapper.classList.add('hidden');
            }

            // Render Filtered Results
            renderHierarchyResults();
        }

        function selectL1(l1) {
            if (activeL1 === l1) {
                activeL1 = null; activeL2 = null; activeL3 = null;
            } else {
                activeL1 = l1; activeL2 = null; activeL3 = null;
            }
            renderHierarchyPage();
        }

        function selectL2(l2) {
            if (activeL2 === l2) {
                activeL2 = null; activeL3 = null;
            } else {
                activeL2 = l2; activeL3 = null;
            }
            renderHierarchyPage();
        }

        function selectL3(l3) {
            if (activeL3 === l3) {
                activeL3 = null;
            } else {
                activeL3 = l3;
            }
            renderHierarchyPage();
        }

        function resetHierarchyFilter() {
            activeL1 = null; activeL2 = null; activeL3 = null;
            renderHierarchyPage();
        }

        function renderHierarchyResults() {
            const grid = document.getElementById('hierarchy-notes-grid');
            const pathDisplay = document.getElementById('filter-path-display');
            grid.innerHTML = '';

            const selectedFilter = activeL3 || activeL2 || activeL1;

            if (selectedFilter) {
                pathDisplay.innerHTML = `선택한 계층 태그: <span class="text-blue-600 font-bold">${selectedFilter}</span>`;
            } else {
                pathDisplay.innerHTML = `조회 중: <span class="text-blue-600 font-bold">전체 노트</span>`;
            }

            const filtered = notes.filter(n => {
                if (!selectedFilter) return true;
                return n.content.includes(selectedFilter);
            });

            document.getElementById('hierarchy-result-count').innerText = `총 ${filtered.length}개 노트`;

            filtered.forEach(note => {
                grid.appendChild(createNoteCard(note));
            });
        }

        // Modal Controls
        function openNoteModal() {
            document.getElementById('note-form').reset();
            document.getElementById('modal-note-id').value = '';
            document.getElementById('modal-title').innerText = '새 노트 작성';
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            document.getElementById('modal-note-id').value = note.id;
            document.getElementById('modal-note-title').value = note.title;
            document.getElementById('modal-note-content').value = note.content;
            document.getElementById('modal-title').innerText = '노트 수정';
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function handleSaveNote(e) {
            e.preventDefault();
            const id = document.getElementById('modal-note-id').value;
            const title = document.getElementById('modal-note-title').value;
            const content = document.getElementById('modal-note-content').value;

            if (id) {
                notes = notes.map(n => n.id == id ? { ...n, title, content } : n);
            } else {
                notes.unshift({
                    id: Date.now(),
                    title,
                    content,
                    createdAt: new Date().toISOString().split('T')[0]
                });
            }

            saveNotes();
            closeNoteModal();
            renderNotesPage();
            renderHierarchyPage();
        }

        function deleteNote(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                notes = notes.filter(n => n.id !== id);
                saveNotes();
                renderNotesPage();
                renderHierarchyPage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Init App
        renderNotesPage();
    </script>
</body>
</html>
