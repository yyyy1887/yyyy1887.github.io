<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 업무 및 일정 관리 기록장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">📋 개인 업무 관리 기록장</h1>
                <p class="text-sm text-gray-500 mt-1">자유로운 해시태그 입력 및 노션형 필터링</p>
            </div>
            <div id="current-date" class="text-sm font-medium text-blue-600 mt-2 sm:mt-0 bg-blue-50 px-3 py-1.5 rounded-lg"></div>
        </header>

        <!-- Task Input Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6">
            <h2 class="text-sm font-semibold text-gray-700 mb-3">새 업무 및 메모 추가</h2>
            <form id="task-form" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="task-title" placeholder="업무 내용 입력 (예: #RP/SEC/SC-1 신규 시스템 검토)" required
                        class="sm:col-span-2 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <button type="submit" class="bg-blue-600 text-white font-medium px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                        + 추가하기
                    </button>
                </div>
                <p class="text-xs text-gray-400">💡 팁: 내용 안에 <strong>#태그명</strong>을 포함하거나 맨 앞에 적어주면 자동으로 태그가 생성됩니다. (예: <code>#PJT/신규프로젝트</code> 또는 <code>#RP</code>)</p>
            </form>
        </div>

        <!-- Filter & Search Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
            <div class="flex flex-wrap gap-2 items-center" id="tag-filters">
                <!-- 동적으로 생성되는 태그 필터 버튼들 -->
            </div>
            <div class="text-xs text-gray-500" id="task-count">총 0개 항목</div>
        </div>

        <!-- Task List (Notion Style List) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div id="task-list" class="divide-y divide-gray-100">
                <!-- Dynamic tasks will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // 초기 샘플 데이터
        let tasks = JSON.parse(localStorage.getItem('obsidian_tasks_v2')) || [
            { id: 1, title: '#RP/SEC/SC-1신규시스템 / 1일 사용량 리포트 제공 필요', tags: ['#RP', '#SEC'], date: '2026-07-23', completed: true },
            { id: 2, title: '#RP/HYE / 장비에 파트 수량 정리하기', tags: ['#RP', '#HYE'], date: '2026-07-22', completed: false },
            { id: 3, title: '#MT / EC-Mixing 신규 컨셉 현장 미팅', tags: ['#MT'], date: '2026-07-23', completed: false }
        ];

        let currentFilter = 'ALL';

        // 오늘 날짜 표시
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

        function saveAndRender() {
            localStorage.setItem('obsidian_tasks_v2', JSON.stringify(tasks));
            renderTags();
            renderTasks();
        }

        // 텍스트에서 #으로 시작하는 해시태그 추출 함수
        function extractTags(text) {
            const matches = text.match(/#[^\s#]+/g);
            return matches ? [...new Set(matches)] : ['#기타'];
        }

        // 상단 태그 필터 버튼 동적 생성
        function renderTags() {
            const filterContainer = document.getElementById('tag-filters');
            
            // 모든 태그 수집
            let allTagsSet = new Set();
            tasks.forEach(t => {
                if (t.tags) t.tags.forEach(tag => allTagsSet.add(tag));
            });
            let uniqueTags = Array.from(allTagsSet).sort();

            let html = `<button onclick="filterTasks('ALL')" class="px-3 py-1 text-xs font-semibold rounded-full ${currentFilter === 'ALL' ? 'bg-gray-900 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">전체보기</button>`;

            uniqueTags.forEach(tag => {
                const isActive = currentFilter === tag;
                html += `<button onclick="filterTasks('${tag}')" class="px-3 py-1 text-xs font-semibold rounded-full ${isActive ? 'bg-gray-900 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">${tag}</button>`;
            });

            filterContainer.innerHTML = html;
        }

        function renderTasks() {
            const listContainer = document.getElementById('task-list');
            listContainer.innerHTML = '';

            let filteredTasks = tasks;
            if (currentFilter !== 'ALL') {
                filteredTasks = tasks.filter(t => t.tags && t.tags.includes(currentFilter));
            }

            document.getElementById('task-count').innerText = `총 ${filteredTasks.length}개 항목`;

            if (filteredTasks.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">등록된 업무 내용이 없습니다.</div>`;
                return;
            }

            filteredTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `p-4 flex items-center justify-between hover:bg-gray-50 transition ${task.completed ? 'bg-gray-50/60' : ''}`;
                
                let tagsHtml = '';
                if(task.tags) {
                    task.tags.forEach(tag => {
                        tagsHtml += `<span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-blue-100 text-blue-800">${tag}</span>`;
                    });
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})"
                            class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 flex-1">
                            <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                            <span class="text-sm ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs text-gray-400 hidden sm:inline">${task.date}</span>
                        <button onclick="deleteTask(${task.id})" class="text-gray-400 hover:text-red-500 text-xs px-2 py-1">삭제</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function filterTasks(tag) {
            currentFilter = tag;
            renderTags();
            renderTasks();
        }

        // 폼 제출 이벤트 (자유 태그 추출)
        document.getElementById('task-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const titleInput = document.getElementById('task-title');
            const rawText = titleInput.value.trim();
            
            const extractedTags = extractTags(rawText);
            const todayStr = new Date().toISOString().split('T')[0];

            const newTask = {
                id: Date.now(),
                title: rawText,
                tags: extractedTags,
                date: todayStr,
                completed: false
            };

            tasks.unshift(newTask);
            titleInput.value = '';
            saveAndRender();
        });

        // 초기 렌더링 실행
        saveAndRender();
    </script>
</body>
</html>
