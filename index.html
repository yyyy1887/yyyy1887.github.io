<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Obsidian Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 700; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex justify-between items-center h-16">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white px-2.5 py-1 rounded-lg font-bold text-sm">
                    📝
                </div>
                <div>
                    <h1 class="font-bold text-gray-900 text-base leading-tight">My Workspace</h1>
                    <p class="text-xs text-gray-500">노트 · 계층태그 · TODO · 노션 표 뷰</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex space-x-4 sm:space-x-6 text-sm font-medium text-gray-600">
                <button onclick="switchPage('notes')" id="nav-notes" class="tab-btn active py-5 flex items-center gap-1.5">
                    <span>📖 노트 기록장</span>
                </button>
                <button onclick="switchPage('todo')" id="nav-todo" class="tab-btn py-5 flex items-center gap-1.5">
                    <span>☑️ TODO 관리</span>
                </button>
                <button onclick="switchPage('hierarchy')" id="nav-hierarchy" class="tab-btn py-5 flex items-center gap-1.5">
                    <span>📊 계층 태그 표 탐색</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">

        <!-- PAGE 1: NOTES -->
        <section id="page-notes" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div class="relative flex-1 w-full sm:w-auto">
                    <input type="text" id="search-input" oninput="renderNotesPage()" placeholder="🔍 노트 제목, 본문, #태그 검색..." 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="button" onclick="openNoteModal()" class="w-full sm:w-auto bg-blue-600 text-white font-medium px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <span>✏️ 새 노트 작성하기</span>
                </button>
            </div>

            <div id="notes-list" class="space-y-4"></div>
        </section>

        <!-- PAGE 2: TODO -->
        <section id="page-todo" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                    <div>
                        <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                            ☑️ TODO 태스크 보관함
                        </h2>
                        <p class="text-sm text-gray-500 mt-1">노트 본문 중 <code>[ 업무내용 / @담당자 / E:종료일 / @@요청자 ]</code> 항목을 자동 추출합니다.</p>
                    </div>
                    <div id="todo-stats" class="text-xs font-semibold px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg w-fit"></div>
                </div>

                <div class="flex flex-wrap gap-2 pt-2 border-t border-gray-100">
                    <select id="todo-filter-assignee" onchange="renderTodoPage()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:outline-none">
                        <option value="ALL">전체 담당자 (@)</option>
                    </select>
                    <select id="todo-filter-requester" onchange="renderTodoPage()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:outline-none">
                        <option value="ALL">전체 요청자 (@@)</option>
                    </select>
                    <select id="todo-filter-status" onchange="renderTodoPage()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:outline-none">
                        <option value="ALL">전체 상태</option>
                        <option value="PENDING">진행중</option>
                        <option value="COMPLETED">완료됨</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                <div id="todo-list" class="divide-y divide-gray-100"></div>
            </div>
        </section>

        <!-- PAGE 3: NOTION TABLE STYLE HIERARCHY EXPLORER -->
        <section id="page-hierarchy" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                            📊 계층 태그 노션 표(Table) 탐색
                        </h2>
                        <p class="text-sm text-gray-500 mt-1">노트 및 TODO 항목을 <code>이름 | 현황 | 대분류 | 중분류 | 소분류</code> 표 형태로 모아봅니다.</p>
                    </div>
                    <button onclick="resetTableFilters()" class="text-xs text-blue-600 hover:underline">필터 초기화</button>
                </div>

                <!-- Table Header Filter Selectors -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t border-gray-100 text-xs">
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">▾ 현황</label>
                        <select id="table-filter-status" onchange="renderHierarchyPage()" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg focus:outline-none">
                            <option value="ALL">전체</option>
                            <option value="진행중">진행중</option>
                            <option value="완료">완료</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">▾ 대분류</label>
                        <select id="table-filter-l1" onchange="renderHierarchyPage()" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg focus:outline-none">
                            <option value="ALL">전체</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">▾ 중분류</label>
                        <select id="table-filter-l2" onchange="renderHierarchyPage()" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg focus:outline-none">
                            <option value="ALL">전체</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-semibold">▾ 소분류</label>
                        <select id="table-filter-l3" onchange="renderHierarchyPage()" class="w-full px-2.5 py-1.5 border border-gray-300 rounded-lg focus:outline-none">
                            <option value="ALL">전체</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Notion Style Table Component -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 bg-gray-50/50 text-xs text-gray-500">
                            <th class="py-3 px-4 font-semibold w-2/5 min-w-[240px]">Aa 이름</th>
                            <th class="py-3 px-3 font-semibold w-24">▾ 현황</th>
                            <th class="py-3 px-3 font-semibold w-28">▾ 대분류</th>
                            <th class="py-3 px-3 font-semibold w-32">▾ 중분류</th>
                            <th class="py-3 px-3 font-semibold w-40">▾ 소분류</th>
                        </tr>
                    </thead>
                    <tbody id="notion-table-body" class="divide-y divide-gray-100 text-gray-800 font-normal">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Note Modal (New / Edit) -->
    <div id="note-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-900 text-lg" id="modal-title">새 노트 작성</h3>
                <button type="button" onclick="closeNoteModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
            </div>
            
            <form id="note-form" onsubmit="handleSaveNote(event)" class="space-y-4">
                <input type="hidden" id="modal-note-id">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">노트 제목 / 일자</label>
                    <input type="text" id="modal-note-title" placeholder="예: 2026-10-29 (목) 업무 일지" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-gray-600">본문 내용 (TODO, 계층 태그, 이미지)</label>
                        <div class="flex items-center gap-2">
                            <label for="image-upload" class="cursor-pointer text-xs font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded border border-blue-200 transition">
                                🖼️ 이미지 파일 첨부
                            </label>
                            <input type="file" id="image-upload" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                        </div>
                    </div>
                    <textarea id="modal-note-content" rows="12" placeholder="예시:&#10;#HYE/설계팀/인사평가&#10;[인사평가 목요일까지 진행하기 / @양승기 / E:2026-10-29]&#10;&#10;#RP/SEC/전장그래픽보드 표준화&#10;[그래픽보드 작화 관련 표준화 진행 / @양승기]" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 leading-relaxed"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeNoteModal()" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm font-medium rounded-lg hover:bg-gray-50">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const initialNotes = [
            {
                id: 1,
                title: "설계팀 인사평가 진행건",
                content: "#HYE/설계팀/인사평가\n[인사평가 목요일까지 진행하기 / @양승기 / E:2026-10-29]",
                createdAt: "2026-10-29"
            },
            {
                id: 2,
                title: "전장 표준화 업무",
                content: "#RP/SEC/전장그래픽보드 표준화\n[그래픽보드 작화 관련 표준화 진행 / @양승기]",
                createdAt: "2026-10-28"
            },
            {
                id: 3,
                title: "폐황산 미팅 내용",
                content: "#PJT/SEC/P1L WH2SO4 MODI\n[폐황산 모디파이 관련 담당자 요청사항 미팅 필요 내용확인해서 미... / @양승기]",
                createdAt: "2026-10-27"
            },
            {
                id: 4,
                title: "LPC 흡기필터 검토",
                content: "#PJT/SEC/P5L PH1\n[LPC 흡기필터 검토 / @양승기]",
                createdAt: "2026-10-26"
            },
            {
                id: 5,
                title: "펌프SOL 확인",
                content: "#RP/SEC/POU Sol분리구성\n[펌프SOL 확인 / @양승기]",
                createdAt: "2026-10-25"
            },
            {
                id: 6,
                title: "E社 VMB 개선",
                content: "#SafeTrans\n[E社 VMB TSV 개선 적용 관련 확인 요청 드립니 / @양승기]",
                createdAt: "2026-10-24"
            }
        ];

        let notes = JSON.parse(localStorage.getItem('obsidian_todo_notes')) || initialNotes;
        let todoCompletedState = JSON.parse(localStorage.getItem('obsidian_todo_state')) || {};

        function saveNotes() {
            localStorage.setItem('obsidian_todo_notes', JSON.stringify(notes));
        }

        function saveTodoState() {
            localStorage.setItem('obsidian_todo_state', JSON.stringify(todoCompletedState));
        }

        function openNoteModal() {
            document.getElementById('note-form').reset();
            document.getElementById('modal-note-id').value = '';
            document.getElementById('modal-title').innerText = '새 노트 작성';
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
        }

        function switchPage(page) {
            document.getElementById('page-notes').classList.toggle('hidden', page !== 'notes');
            document.getElementById('page-todo').classList.toggle('hidden', page !== 'todo');
            document.getElementById('page-hierarchy').classList.toggle('hidden', page !== 'hierarchy');
            
            document.getElementById('nav-notes').classList.toggle('active', page === 'notes');
            document.getElementById('nav-todo').classList.toggle('active', page === 'todo');
            document.getElementById('nav-hierarchy').classList.toggle('active', page === 'hierarchy');

            if (page === 'notes') renderNotesPage();
            if (page === 'todo') renderTodoPage();
            if (page === 'hierarchy') renderHierarchyPage();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const max_size = 800;
                    let width = img.width, height = img.height;

                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('modal-note-content').value += `\n![이미지](${compressedBase64})\n`;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderFormattedContent(text) {
            const escaped = escapeHtml(text);
            return escaped.replace(/!\[(.*?)\]\((.*?)\)/g, function(match, alt, url) {
                return `<div class="my-2"><img src="${url}" alt="${alt}" class="max-h-96 rounded-lg border border-gray-200 shadow-sm object-contain"></div>`;
            });
        }

        function extractHashtags(text) {
            const matches = text.match(/#[^\s#]+/g);
            return matches ? [...new Set(matches)] : [];
        }

        function parseTagParts(tagStr) {
            if (!tagStr) return { l1: '', l2: '', l3: '' };
            const clean = tagStr.replace('#', '');
            const parts = clean.split('/');
            return {
                l1: parts[0] || '',
                l2: parts[1] || '',
                l3: parts[2] || ''
            };
        }

        function extractAllTableItems() {
            let items = [];
            notes.forEach(note => {
                const lines = note.content.split('\n');
                let currentTag = '';

                lines.forEach((line, idx) => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('#')) {
                        currentTag = trimmed.split(' ')[0];
                    }

                    const todoMatch = trimmed.match(/^\[(.*?)\]$/);
                    if (todoMatch) {
                        const parts = todoMatch[1].split('/').map(p => p.trim());
                        const taskText = parts[0] || note.title;
                        const todoId = `${note.id}_${idx}`;
                        const isCompleted = !!todoCompletedState[todoId];
                        const tagParts = parseTagParts(currentTag);

                        items.push({
                            id: todoId,
                            title: taskText,
                            status: isCompleted ? '완료' : '진행중',
                            l1: tagParts.l1,
                            l2: tagParts.l2,
                            l3: tagParts.l3
                        });
                    }
                });

                // If note has no specific [] todo syntax, add note itself as a row
                if (!note.content.includes('[')) {
                    const tags = extractHashtags(note.content);
                    const tagParts = parseTagParts(tags[0] || '');
                    items.push({
                        id: note.id,
                        title: note.title,
                        status: '진행중',
                        l1: tagParts.l1,
                        l2: tagParts.l2,
                        l3: tagParts.l3
                    });
                }
            });
            return items;
        }

        function renderNotesPage() {
            const list = document.getElementById('notes-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            list.innerHTML = '';

            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(search) || n.content.toLowerCase().includes(search)
            );

            filtered.forEach(note => {
                const doc = document.createElement('div');
                doc.className = "bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-3";
                const tags = extractHashtags(note.content);
                const tagsHtml = tags.map(t => `<span class="text-xs px-2.5 py-1 rounded bg-blue-50 text-blue-700 font-semibold">${t}</span>`).join(' ');

                doc.innerHTML = `
                    <div class="flex justify-between items-start border-b pb-3">
                        <h3 class="font-bold text-gray-900 text-lg">${escapeHtml(note.title)}</h3>
                        <div class="flex items-center gap-3 text-xs text-gray-500">
                            <span>📅 ${note.createdAt}</span>
                            <button onclick="editNote(${note.id})" class="hover:text-blue-600 font-medium">수정</button>
                            <button onclick="deleteNote(${note.id})" class="hover:text-red-600 font-medium">삭제</button>
                        </div>
                    </div>
                    ${tags.length > 0 ? `<div class="flex flex-wrap gap-1.5">${tagsHtml}</div>` : ''}
                    <div class="text-sm text-gray-800 font-mono whitespace-pre-wrap leading-relaxed bg-gray-50 p-4 rounded-lg border border-gray-100">${renderFormattedContent(note.content)}</div>
                `;
                list.appendChild(doc);
            });
        }

        function renderTodoPage() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';
            // Render basic todo list...
        }

        // Notion Table Render Logic
        function renderHierarchyPage() {
            const tbody = document.getElementById('notion-table-body');
            const items = extractAllTableItems();

            // Populate Filter Select Options
            const l1Set = [...new Set(items.map(i => i.l1).filter(Boolean))];
            const l2Set = [...new Set(items.map(i => i.l2).filter(Boolean))];
            const l3Set = [...new Set(items.map(i => i.l3).filter(Boolean))];

            updateSelectOptions('table-filter-l1', l1Set);
            updateSelectOptions('table-filter-l2', l2Set);
            updateSelectOptions('table-filter-l3', l3Set);

            const statusFilter = document.getElementById('table-filter-status').value;
            const l1Filter = document.getElementById('table-filter-l1').value;
            const l2Filter = document.getElementById('table-filter-l2').value;
            const l3Filter = document.getElementById('table-filter-l3').value;

            const filtered = items.filter(i => {
                if (statusFilter !== 'ALL' && i.status !== statusFilter) return false;
                if (l1Filter !== 'ALL' && i.l1 !== l1Filter) return false;
                if (l2Filter !== 'ALL' && i.l2 !== l2Filter) return false;
                if (l3Filter !== 'ALL' && i.l3 !== l3Filter) return false;
                return true;
            });

            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400">표시할 데이터가 없습니다.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition border-b border-gray-100";

                const l1Pill = item.l1 ? `<span class="px-2 py-0.5 rounded text-xs bg-emerald-100 text-emerald-800 font-medium">${item.l1}</span>` : '';
                const l2Pill = item.l2 ? `<span class="px-2 py-0.5 rounded text-xs bg-purple-100 text-purple-800 font-medium">${item.l2}</span>` : '';
                const l3Pill = item.l3 ? `<span class="px-2 py-0.5 rounded text-xs bg-amber-100 text-amber-800 font-medium">${item.l3}</span>` : '';

                tr.innerHTML = `
                    <td class="py-2.5 px-4 font-medium text-gray-900 flex items-center gap-2">
                        <span class="text-gray-400">📄</span>
                        <span class="line-clamp-1">${escapeHtml(item.title)}</span>
                    </td>
                    <td class="py-2.5 px-3">
                        <span class="px-2 py-0.5 rounded text-xs font-semibold ${item.status === '완료' ? 'bg-gray-200 text-gray-600' : 'bg-blue-100 text-blue-700'}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="py-2.5 px-3">${l1Pill}</td>
                    <td class="py-2.5 px-3">${l2Pill}</td>
                    <td class="py-2.5 px-3">${l3Pill}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateSelectOptions(elementId, setValues) {
            const select = document.getElementById(elementId);
            const currentVal = select.value;
            select.innerHTML = '<option value="ALL">전체</option>' + setValues.map(v => `<option value="${v}">${v}</option>`).join('');
            if (setValues.includes(currentVal)) select.value = currentVal;
        }

        function resetTableFilters() {
            document.getElementById('table-filter-status').value = 'ALL';
            document.getElementById('table-filter-l1').value = 'ALL';
            document.getElementById('table-filter-l2').value = 'ALL';
            document.getElementById('table-filter-l3').value = 'ALL';
            renderHierarchyPage();
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            document.getElementById('modal-note-id').value = note.id;
            document.getElementById('modal-note-title').value = note.title;
            document.getElementById('modal-note-content').value = note.content;
            document.getElementById('modal-title').innerText = '노트 수정';
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function handleSaveNote(e) {
            e.preventDefault();
            const id = document.getElementById('modal-note-id').value;
            const title = document.getElementById('modal-note-title').value;
            const content = document.getElementById('modal-note-content').value;

            if (id) {
                notes = notes.map(n => n.id == id ? { ...n, title, content } : n);
            } else {
                notes.unshift({
                    id: Date.now(),
                    title,
                    content,
                    createdAt: new Date().toISOString().split('T')[0]
                });
            }

            saveNotes();
            closeNoteModal();
            renderNotesPage();
        }

        function deleteNote(id) {
            if (confirm('이 노트를 삭제하시겠습니까?')) {
                notes = notes.filter(n => n.id !== id);
                saveNotes();
                renderNotesPage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        renderNotesPage();
    </script>
</body>
</html>
