<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Style Graph View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Header Controls */
    header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 12px;
      background: rgba(22, 27, 34, 0.8);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
    }

    button {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    button:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <header>
    <button id="reset-btn">화면 초기화</button>
    <button id="add-btn">노드 추가</button>
  </header>

  <canvas id="graph-canvas"></canvas>

  <script>
    const canvas = document.getElementById('graph-canvas');
    const ctx = canvas.getContext('2d');

    // Canvas Resize
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Graph Data Structure
    const numNodes = 40;
    const nodes = [];
    const links = [];

    // Initialize Nodes
    for (let i = 0; i < numNodes; i++) {
      nodes.push({
        id: i,
        label: `Note ${i + 1}`,
        x: (Math.random() - 0.5) * 800,
        y: (Math.random() - 0.5) * 800,
        vx: 0,
        vy: 0,
        radius: 4 + Math.random() * 5
      });
    }

    // Initialize Links (Random connections)
    for (let i = 0; i < numNodes; i++) {
      const targetCount = Math.floor(Math.random() * 2) + 1;
      for (let j = 0; j < targetCount; j++) {
        const target = Math.floor(Math.random() * numNodes);
        if (target !== i) {
          links.push({ source: i, target: target });
        }
      }
    }

    // Camera State (Zoom & Pan)
    let transform = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      k: 1
    };

    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let draggedNode = null;
    let hoveredNode = null;

    // Convert Screen to World Coords
    function screenToWorld(sx, sy) {
      return {
        x: (sx - transform.x) / transform.k,
        y: (sy - transform.y) / transform.k
      };
    }

    // Force Simulation Logic
    function updatePhysics() {
      const repelStrength = 400;
      const linkDistance = 80;
      const springStrength = 0.03;
      const damping = 0.85;

      // 1. Repulsion between nodes
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[j].x - nodes[i].x;
          const dy = nodes[j].y - nodes[i].y;
          const distSq = dx * dx + dy * dy + 0.1;
          const force = repelStrength / distSq;
          const fx = (dx / Math.sqrt(distSq)) * force;
          const fy = (dy / Math.sqrt(distSq)) * force;

          nodes[i].vx -= fx;
          nodes[i].vy -= fy;
          nodes[j].vx += fx;
          nodes[j].vy += fy;
        }
      }

      // 2. Spring force along links
      links.forEach(link => {
        const source = nodes[link.source];
        const target = nodes[link.target];
        const dx = target.x - source.x;
        const dy = target.y - source.y;
        const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
        const force = (dist - linkDistance) * springStrength;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;

        source.vx += fx;
        source.vy += fy;
        target.vx -= fx;
        target.vy -= fy;
      });

      // 3. Central Gravity
      nodes.forEach(node => {
        node.vx -= node.x * 0.001;
        node.vy -= node.y * 0.001;

        if (node !== draggedNode) {
          node.vx *= damping;
          node.vy *= damping;
          node.x += node.vx;
          node.y += node.vy;
        } else {
          node.vx = 0;
          node.vy = 0;
        }
      });
    }

    // Render Function
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.k, transform.k);

      // Draw Links
      ctx.strokeStyle = "#30363d";
      ctx.lineWidth = 1;
      links.forEach(link => {
        const source = nodes[link.source];
        const target = nodes[link.target];
        ctx.beginPath();
        ctx.moveTo(source.x, source.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
      });

      // Draw Nodes
      nodes.forEach(node => {
        const isHovered = node === hoveredNode;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius * (isHovered ? 1.4 : 1), 0, Math.PI * 2);
        ctx.fillStyle = isHovered ? "#58a6ff" : "#2f81f7";
        ctx.fill();

        // Node Label
        ctx.fillStyle = isHovered ? "#ffffff" : "#8b949e";
        ctx.font = `${12 / transform.k}px sans-serif`;
        ctx.fillText(node.label, node.x + node.radius + 4, node.y + 4);
      });

      ctx.restore();
    }

    // Animation Loop
    function animate() {
      updatePhysics();
      draw();
      requestAnimationFrame(animate);
    }
    animate();

    // Mouse & Touch Events
    canvas.addEventListener('mousedown', (e) => {
      const mouseWorld = screenToWorld(e.clientX, e.clientY);

      // Check node click
      draggedNode = nodes.find(node => {
        const dx = node.x - mouseWorld.x;
        const dy = node.y - mouseWorld.y;
        return Math.sqrt(dx * dx + dy * dy) < node.radius + 5;
      });

      if (!draggedNode) {
        isDragging = true;
        dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const mouseWorld = screenToWorld(e.clientX, e.clientY);

      // Hover check
      hoveredNode = nodes.find(node => {
        const dx = node.x - mouseWorld.x;
        const dy = node.y - mouseWorld.y;
        return Math.sqrt(dx * dx + dy * dy) < node.radius + 5;
      });

      if (draggedNode) {
        draggedNode.x = mouseWorld.x;
        draggedNode.y = mouseWorld.y;
      } else if (isDragging) {
        transform.x = e.clientX - dragStart.x;
        transform.y = e.clientY - dragStart.y;
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      draggedNode = null;
    });

    // Zoom Handling
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.min(Math.max(0.2, transform.k * zoomFactor), 5);

      transform.x = e.clientX - (e.clientX - transform.x) * (newScale / transform.k);
      transform.y = e.clientY - (e.clientY - transform.y) * (newScale / transform.k);
      transform.k = newScale;
    }, { passive: false });

    // Buttons
    document.getElementById('reset-btn').addEventListener('click', () => {
      transform = { x: window.innerWidth / 2, y: window.innerHeight / 2, k: 1 };
    });

    document.getElementById('add-btn').addEventListener('click', () => {
      const id = nodes.length;
      const newNode = {
        id: id,
        label: `Note ${id + 1}`,
        x: (Math.random() - 0.5) * 200,
        y: (Math.random() - 0.5) * 200,
        vx: 0,
        vy: 0,
        radius: 4 + Math.random() * 5
      };
      nodes.push(newNode);

      // Connect to random existing node
      const target = Math.floor(Math.random() * (nodes.length - 1));
      links.push({ source: id, target: target });
    });
  </script>
</body>
</html>
